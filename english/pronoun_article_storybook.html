<title>대명사·관사 그림책</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root{
  --paper:#FFF8EF;
  --card:#FFFFFF;
  --ink:#4A3B32;
  --ink-soft:#97836F;
  --ink-faint:#C3B29E;
  --line:#F0E3D1;

  --subj:#4FB8E8;      --subj-deep:#1E8FC4;  --subj-soft:#E1F4FC;
  --obj:#FFA94D;       --obj-deep:#E8821A;   --obj-soft:#FFEDD9;
  --demo:#5FCB7A;      --demo-deep:#2FA352;  --demo-soft:#E1F7E6;
  --art:#E369C9;       --art-deep:#C93FA8;   --art-soft:#FBE3F5;

  --ok:#38C172;
  --font-display:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-word:'Baloo 2','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 70% 40% at 12% 0%, #E1F4FC 0%, transparent 55%),
    radial-gradient(ellipse 70% 40% at 88% 12%, #FBE3F5 0%, transparent 55%),
    radial-gradient(ellipse 60% 35% at 90% 95%, #E1F7E6 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px; margin:0 auto; padding:20px 18px 28px; position:relative; min-height:100vh; display:flex; flex-direction:column;}

/* ---------- header / mascot ---------- */
header.top{display:flex; align-items:flex-start; gap:14px; margin-bottom:18px;}
.mascot{width:76px; height:76px; flex-shrink:0; filter:drop-shadow(0 4px 8px #00000014);}
.title-block h1{font-family:var(--font-display); font-weight:700; font-size:clamp(27px,7.2vw,36px); margin:2px 0 7px; color:var(--ink); text-wrap:balance;}
.bubble{position:relative; background:var(--card); border:2px solid var(--line); border-radius:16px 16px 16px 4px; padding:12px 16px; font-size:18px; color:var(--ink-soft); line-height:1.5; margin:0; box-shadow:0 3px 10px #00000008;}

/* ---------- home shelf ---------- */
.shelf{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:4px; flex:1;}
@media (max-width:380px){ .shelf{grid-template-columns:1fr;} }
.landCard{
  --c:var(--subj); --cd:var(--subj-deep); --cs:var(--subj-soft);
  position:relative; border:none; cursor:pointer; text-align:left; padding:0;
  background:var(--card); border-radius:24px; border:3px solid var(--line);
  overflow:hidden; min-height:236px; display:flex; flex-direction:column;
  box-shadow:0 6px 16px #00000010; transition:transform .12s ease;
}
.landCard:active{transform:scale(.97);}
.landCard .cover{flex:1; background:var(--cs); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:13px; padding:18px 10px; position:relative;}
.landCard .cover svg{width:60px; height:60px;}
.landCard .coverTitle{font-family:var(--font-word); font-weight:800; font-size:23px; color:var(--cd); text-align:center; line-height:1.15;}
.landCard .coverTitle span{display:block; font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--ink-soft); margin-top:4px;}
.landCard .footer{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--card);}
.landCard .footer .num{font-family:var(--font-word); font-weight:700; font-size:16px; color:var(--ink-faint); letter-spacing:.5px;}
.landCard .sticker{font-size:26px; line-height:1;}
.landCard.done{border-color:var(--c);}

.bonusCard{margin-top:16px; border:3px dashed var(--ink-faint); border-radius:20px; background:transparent; padding:20px; display:flex; align-items:center; justify-content:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--ink-faint); cursor:default; text-align:center;}
.bonusCard .star{font-size:28px;}
.bonusCard.unlocked{cursor:pointer; border-style:solid; border-color:var(--art); background:var(--art-soft); color:var(--art-deep);}
.bonusCard.unlocked:active{transform:scale(.98);}

.footnote{margin-top:16px; text-align:center; color:var(--ink-faint); font-size:14.5px;}

/* ---------- full-screen panel ---------- */
.overlay{position:fixed; inset:0; z-index:20; background:#4A3B3266; backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.open{opacity:1; pointer-events:auto;}
.panel{width:100%; max-width:640px; height:93vh; height:93dvh; max-height:93vh; max-height:93dvh;
  background:
    radial-gradient(ellipse 90% 40% at 15% 0%, #E1F4FC77, transparent 55%),
    radial-gradient(ellipse 90% 40% at 100% 100%, #FBE3F577, transparent 55%),
    var(--paper);
  border-radius:26px 26px 0 0; border:3px solid var(--line); border-bottom:none;
  padding:16px 18px 20px; overflow-y:auto; transform:translateY(16px); transition:transform .22s ease;
  box-shadow:0 -10px 30px #00000018; display:flex; flex-direction:column;}
.overlay.open .panel{transform:translateY(0);}
.panel-head{display:flex; align-items:center; gap:8px;}
.panel-head h2{font-family:var(--font-display); font-weight:700; font-size:25px; margin:0; color:var(--ink); flex:1;}
.panel-sub{font-size:16.5px; color:var(--ink-faint); margin:3px 0 8px; font-family:var(--font-word); font-weight:600; letter-spacing:.3px;}
.iconBtn{background:var(--card); border:2px solid var(--line); color:var(--ink-soft); width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:19px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

#stage{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; overflow-y:auto; gap:2px;}

/* ---------- learn cards ---------- */
.learnCard{display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px; padding:10px 4px;}
.learnCard .stageArt{font-size:88px; line-height:1;}
.learnCard .exGrid{display:flex; gap:15px; flex-wrap:wrap; justify-content:center;}
.exGrid .exCard{background:var(--card); border:2.5px solid var(--line); border-radius:18px; padding:16px 18px; min-width:100px; box-shadow:0 4px 10px #00000008;}
.exGrid .exCard .e{font-size:46px;}
.exGrid .exCard .w{font-family:var(--font-word); font-weight:700; font-size:19px; margin-top:5px; color:var(--ink);}
.learnCard .say{font-family:var(--font-display); font-weight:700; font-size:26px; line-height:1.5; color:var(--ink); text-wrap:balance; max-width:420px;}
.learnCard .sentence{font-family:var(--font-word); font-weight:600; font-size:23px; color:var(--ink-soft); background:var(--card); border:2px dashed var(--ink-faint); border-radius:14px; padding:14px 20px;}
.learnCard .sentence b{color:var(--cd,var(--subj-deep));}
.learnCard .recap{font-family:var(--font-display); font-weight:700; font-size:19px; padding:11px 20px; border-radius:18px; background:var(--cs,var(--subj-soft)); color:var(--cd,var(--subj-deep)); line-height:1.5;}
.dots{display:flex; gap:6px; justify-content:center; margin:2px 0 0;}
.dots span{width:9px; height:9px; border-radius:50%; background:var(--line);}
.dots span.on{background:var(--c,var(--subj));}
.bigNextBtn{margin-top:8px; width:100%; padding:18px; border:none; border-radius:16px; background:var(--c,var(--subj)); color:#fff; font-family:var(--font-display); font-weight:700; font-size:21px; cursor:pointer; box-shadow:0 5px 0 var(--cd,var(--subj-deep));}
.bigNextBtn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--cd,var(--subj-deep));}

/* demonstrative concept grid (learn card 2) */
.demoGrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:340px; margin:0 auto;}
.demoCell{background:var(--card); border:2.5px solid var(--line); border-radius:16px; padding:14px 10px; text-align:center;}
.demoCell .dt{font-family:var(--font-word); font-weight:800; font-size:22px; color:var(--demo-deep);}
.demoCell .dd{font-family:var(--font-display); font-weight:700; font-size:14.5px; color:var(--ink-soft); margin-top:4px;}

/* ---------- practice ---------- */
.qn{text-align:center; font-family:var(--font-word); font-weight:700; font-size:16px; color:var(--ink-faint); letter-spacing:.4px; margin-bottom:9px;}
.practiceCard{background:var(--card); border:3px solid var(--line); border-radius:26px; padding:38px 22px; text-align:center; margin:0 auto 24px; max-width:340px; box-shadow:0 6px 16px #00000010;}
.practiceCard .e{font-size:108px; line-height:1;}
.practiceCard .w{font-family:var(--font-word); font-weight:800; font-size:44px; color:var(--ink); margin-top:9px;}
.practiceCard.sentenceMode{max-width:380px; padding:26px 22px;}
.practiceCard .qLabel{font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--ink-faint);}
.practiceCard .sent{font-family:var(--font-word); font-weight:600; font-size:26px; color:var(--ink); line-height:1.55; margin:8px 0; text-wrap:balance;}
.practiceCard .sent b{color:var(--cd,var(--subj-deep)); text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:4px; font-weight:800;}
.practiceCard .sent .blank{display:inline-block; min-width:64px; border-bottom:3px solid var(--cd,var(--subj-deep)); color:var(--cd,var(--subj-deep)); font-weight:800;}
.practiceCard .hint{font-family:var(--font-display); font-weight:800; font-size:21px; color:var(--cd,var(--subj-deep)); background:var(--cs,var(--subj-soft)); display:inline-block; margin-top:10px; padding:7px 16px; border-radius:14px;}
.practiceCard.blankMode .blankWord{font-family:var(--font-word); font-weight:700; font-size:32px; color:var(--ink);}
.practiceCard.blankMode .blankWord .u{display:inline-block; min-width:56px; border-bottom:3px solid var(--cd,var(--subj-deep));}
.practiceCard.blankMode .blankWord b{color:var(--ink); font-weight:800;}

.answerRow{display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:440px; margin:0 auto; width:100%;}
.answerRow.four{grid-template-columns:1fr 1fr;}
.answerRow.three{grid-template-columns:1fr 1fr 1fr; gap:10px;}
.ansBtn{--c:var(--subj); --cd:var(--subj-deep); --cs:var(--subj-soft);
  font-family:var(--font-word); font-weight:700; font-size:21px; background:var(--cs); color:var(--cd);
  border:3px solid var(--c); border-radius:18px; padding:21px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .1s ease;}
.ansBtn.simple{font-size:24px; padding:22px 6px;}
.answerRow.three .ansBtn.simple{font-size:20px; padding:20px 4px;}
.ansBtn .ic{font-size:33px;}
.ansBtn .sub{font-size:14.5px; font-weight:600;}
.ansBtn:active{transform:scale(.96);}
.ansBtn.correct{background:var(--ok); border-color:#279656; color:#fff;}
.ansBtn.wrong{background:#FFE3E3; border-color:#F0577A; color:#C23B5B; opacity:.7;}
.ansBtn[disabled]{cursor:default;}
.fb{text-align:center; min-height:28px; margin-top:15px; font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--ink-soft);}

/* ---------- sticker reward page ---------- */
.rewardPage{text-align:center; padding:6px 4px;}
.rewardPage .stickerBig{font-size:120px; animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(0) rotate(-15deg);} 70%{transform:scale(1.15) rotate(6deg);} 100%{transform:scale(1) rotate(0);}}
.rewardPage h3{font-family:var(--font-display); font-weight:700; font-size:28px; margin:11px 0 5px; color:var(--ink);}
.rewardPage p{color:var(--ink-soft); font-size:18px; margin:4px 0 18px;}
.starsRow{display:flex; justify-content:center; gap:8px; margin:6px 0 16px;}
.starsRow svg{width:36px; height:36px;}

.confetti{position:fixed; width:9px; height:9px; border-radius:3px; pointer-events:none; z-index:60; animation:fall 1.1s ease-out forwards;}
@keyframes fall{0%{transform:translate(0,0) rotate(0deg); opacity:1;} 100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0;}}

@media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }
</style>

<div class="wrap">
  <header class="top">
    <svg class="mascot" viewBox="0 0 100 100">
      <ellipse cx="36" cy="22" rx="9" ry="22" fill="#FFF8EF" stroke="#4A3B32" stroke-width="3"/>
      <ellipse cx="64" cy="22" rx="9" ry="22" fill="#FFF8EF" stroke="#4A3B32" stroke-width="3"/>
      <ellipse cx="36" cy="24" rx="4.5" ry="13" fill="#FFC9D4"/>
      <ellipse cx="64" cy="24" rx="4.5" ry="13" fill="#FFC9D4"/>
      <circle cx="50" cy="60" r="32" fill="#FFF8EF" stroke="#4A3B32" stroke-width="3"/>
      <circle cx="30" cy="66" r="6" fill="#FFC9D4"/>
      <circle cx="70" cy="66" r="6" fill="#FFC9D4"/>
      <circle cx="40" cy="55" r="3.4" fill="#4A3B32"/>
      <circle cx="60" cy="55" r="3.4" fill="#4A3B32"/>
      <path d="M47 65 q3 3 6 0" stroke="#4A3B32" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="title-block">
      <h1>대명사·관사 그림책</h1>
      <p class="bubble" id="homeBubble">또 왔구나! 이번엔 Pronoun과 Article 친구들을 만나보자!</p>
    </div>
  </header>

  <div class="shelf" id="shelf"></div>

  <button class="bonusCard" id="bonusCard" disabled>
    <span class="star">⭐</span>
    <span>네 권을 다 읽으면 '한 번에 맞히기'가 열려요!</span>
  </button>

  <p class="footnote">그림책을 눌러서 Subject·Object Pronoun과 This/That/These/Those, a·an·the를 배워 보세요 🌈</p>
</div>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script>
(function(){
  "use strict";

  var ICONS = {
    subj:'<svg viewBox="0 0 48 48"><circle cx="24" cy="14" r="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 40 v-6 a12 12 0 0 1 24 0 v6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M32 10 h8 v7 l-3-2 -3 2 z" fill="currentColor"/></svg>',
    obj:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="9" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="3" fill="currentColor"/><path d="M38 10 L27 21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M38 10 l-8 -1 1 8 z" fill="currentColor"/></svg>',
    demo:'<svg viewBox="0 0 48 48"><circle cx="19" cy="19" r="11" fill="none" stroke="currentColor" stroke-width="3"/><path d="M27 27 L39 39" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><path d="M19 13 v12 M13 19 h12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
    art:'<svg viewBox="0 0 48 48"><rect x="7" y="10" width="34" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><text x="24" y="31" font-size="18" font-weight="800" text-anchor="middle" fill="currentColor" font-family="Baloo 2, sans-serif">a</text></svg>',
    star:'<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17l-6.1 3.5 1.5-6.8L2.2 9l6.9-.7z"/></svg>'
  };

  /* ================= content ================= */
  var LANDS = {
    subject:{
      title:'Subject Pronoun', sub:'이름대신하는말', color:'subj', icon:'subj',
      learn:[
        {art:'🐰', say:'이번엔 Pronoun(대명사)을 배워보자!'},
        {defLine:'Pronoun(대명사)은 이름을 자꾸 말하지 않도록 대신 쓰는 낱말이에요!',
          examples:[{e:'🙋',w:'I'},{e:'👦',w:'he'},{e:'👧',w:'she'}]},
        {sentence:'Sarah is my friend. <b>She</b> is very kind.', sentNote:'Sarah 대신 She를 썼어요!', recap:'Pronoun = 이름 대신 쓰는 말'}
      ],
      practice:{
        prompt:'이건 Subject Pronoun일까요, Noun일까요?',
        answers:[
          {key:'target', label:'Subject Pronoun', sub:'이름대신하는말', icon:'🙋'},
          {key:'foil', label:'Noun', sub:'이름말', icon:'🏷️'}
        ],
        items:[
          {type:'word', e:'🙋', w:'I', correct:'target'},
          {type:'word', e:'🐱', w:'cat', correct:'foil'},
          {type:'word', e:'👧', w:'she', correct:'target'},
          {type:'word', e:'🍎', w:'apple', correct:'foil'},
          {type:'word', e:'👥', w:'they', correct:'target'},
          {type:'word', e:'👦', w:'he', correct:'target'},
          {type:'sentence', sentence:'Sarah is my friend. <b>She</b> is very kind.', correct:'target'},
          {type:'sentence', sentence:'I saw John yesterday. <b>He</b> seemed a bit tired.', correct:'target'},
          {type:'sentence', sentence:'I don’t like those <b>birds</b>. They are so noisy!', correct:'foil'},
          {type:'defquestion', question:'Which pronoun DOES the verb?', correct:'target'},
          {type:'defquestion', question:'Which one is a ‘thing’ word — the name of a person, place, or thing?', correct:'foil'}
        ]
      }
    },
    object:{
      title:'Object Pronoun', sub:'이름대신받는말', color:'obj', icon:'obj',
      learn:[
        {art:'🐰', say:'이번엔 Object Pronoun을 배워보자! 동작을 받는 자리에 쓰는 대신말이에요.'},
        {defLine:'Object Pronoun은 동작을 ‘받는’ 자리에 쓰는 대신말이에요!',
          examples:[{e:'🙋',w:'me'},{e:'👦',w:'him'},{e:'👧',w:'her'}]},
        {sentence:'My mom likes <b>me</b>.', sentNote:'me가 좋아하는 동작을 받고 있어요!', recap:'Object Pronoun = 동작을 받는 자리에 써요'}
      ],
      practice:{
        prompt:'이건 Object Pronoun일까요, Subject Pronoun일까요?',
        answers:[
          {key:'target', label:'Object Pronoun', sub:'이름대신받는말', icon:'🎯'},
          {key:'foil', label:'Subject Pronoun', sub:'이름대신하는말', icon:'🙋'}
        ],
        items:[
          {type:'word', e:'🙋', w:'me', correct:'target'},
          {type:'word', e:'👦', w:'he', correct:'foil'},
          {type:'word', e:'👦', w:'him', correct:'target'},
          {type:'word', e:'👧', w:'she', correct:'foil'},
          {type:'word', e:'👨‍👩‍👧', w:'us', correct:'target'},
          {type:'word', e:'👥', w:'them', correct:'target'},
          {type:'sentence', sentence:'Tom and I eat <b>it</b>.', correct:'target'},
          {type:'sentence', sentence:'The boy smiles at <b>us</b>.', correct:'target'},
          {type:'sentence', sentence:'<b>He</b> plays soccer.', correct:'foil'},
          {type:'defquestion', question:'Which pronoun is the one that the verb is done to?', correct:'target'},
          {type:'defquestion', question:'Which pronoun DOES the verb?', correct:'foil'}
        ]
      }
    },
    demonstrative:{
      title:'This · That · These · Those', sub:'지시대명사', color:'demo', icon:'demo',
      learn:[
        {art:'🐰', say:'이번엔 This, That, These, Those를 배워보자!'},
        {demoGrid:true, defLine:'가까이 있으면 This·These, 멀리 있으면 That·Those! 하나면 This·That, 여러 개면 These·Those예요.'},
        {sentence:'<b>This</b> book is interesting.', sentNote:'가까이 있는 책 한 권이니까 This예요!', recap:'가깝고 하나=This / 멀고 하나=That / 가깝고 여럿=These / 멀고 여럿=Those'}
      ],
      practice:{
        prompt:'빈칸에 알맞은 말을 골라 보세요!',
        answers:[
          {key:'This', label:'This'},
          {key:'That', label:'That'},
          {key:'These', label:'These'},
          {key:'Those', label:'Those'}
        ],
        items:[
          {type:'sentenceblank', sentence:'___ book is interesting.', hint:'가까이 있는 것 하나', correct:'This'},
          {type:'sentenceblank', sentence:'___ building is very tall.', hint:'멀리 있는 것 하나', correct:'That'},
          {type:'sentenceblank', sentence:'___ apples are delicious.', hint:'가까이 있는 것 여러 개', correct:'These'},
          {type:'sentenceblank', sentence:'___ birds are singing beautifully.', hint:'멀리 있는 것 여러 개', correct:'Those'},
          {type:'sentenceblank', sentence:'___ cats are very cute.', hint:'가까이 있는 것 여러 개', correct:'These'},
          {type:'sentenceblank', sentence:'I’d like ___ milkshake over there, please.', hint:'멀리 있는 것 하나', correct:'That'},
          {type:'sentenceblank', sentence:'___ cake is disgusting, but that one is nice.', hint:'가까이 있는 것 하나', correct:'This'},
          {type:'sentenceblank', sentence:'He wants to see ___ new movie.', hint:'멀리 있는 것 하나', correct:'That'},
          {type:'sentenceblank', sentence:'Come and smell ___ beautiful flowers.', hint:'가까이 있는 것 여러 개', correct:'These'},
          {type:'defquestion', question:'Which word means “a thing close to you”?', correct:'This'},
          {type:'defquestion', question:'Which word means “things far away”?', correct:'Those'}
        ]
      }
    },
    article:{
      title:'a · an · the', sub:'관사', color:'art', icon:'art',
      learn:[
        {art:'🐰', say:'마지막으로 Article(관사)을 배워보자! a, an, the예요.'},
        {defLine:'A는 아무거나 하나, An은 다음 소리가 모음일 때, The는 이미 말했거나 특별한 것을 말할 때 써요!',
          examples:[{e:'🐱',w:'a cat'},{e:'🍎',w:'an apple'},{e:'☀️',w:'the sun'}]},
        {sentence:'I have <b>a</b> cat.', sentNote:'cat은 자음 소리로 시작해서 a를 써요!', recap:'a=아무거나 하나 / an=모음 소리 앞 / the=특별한 것'}
      ],
      practice:{
        prompt:'빈칸에 알맞은 관사를 골라 보세요!',
        answers:[
          {key:'a', label:'a'},
          {key:'an', label:'an'},
          {key:'the', label:'the'}
        ],
        items:[
          {type:'wordblank', word:'grape', correct:'a'},
          {type:'wordblank', word:'elephant', correct:'an'},
          {type:'wordblank', word:'insect', correct:'an'},
          {type:'wordblank', word:'snake', correct:'a'},
          {type:'wordblank', word:'apple', correct:'an'},
          {type:'wordblank', word:'cat', correct:'a'},
          {type:'sentenceblank', sentence:'___ Moon is the brightest thing in the night sky.', hint:'하늘에 하나뿐인 특별한 것', correct:'the'},
          {type:'sentenceblank', sentence:'Let’s go to ___ beach and swim.', hint:'우리가 이미 알고 있는 그 바닷가', correct:'the'},
          {type:'sentenceblank', sentence:'She has ___ interesting story to tell.', hint:'interesting는 모음 소리로 시작해요', correct:'an'},
          {type:'defquestion', question:'Which article do we use for a noun we already know, or have already introduced?', correct:'the'},
          {type:'defquestion', question:'Which article do we use when the next word starts with a vowel sound?', correct:'an'}
        ]
      }
    }
  };
  var LAND_ORDER = ['subject','object','demonstrative','article'];

  var BONUS_ITEMS = [
    {type:'word', e:'🙋', w:'I', land:'subject', correct:'target'},
    {type:'word', e:'👦', w:'him', land:'object', correct:'target'},
    {type:'sentenceblank', sentence:'___ book is interesting.', hint:'가까이 있는 것 하나', land:'demonstrative', correct:'This'},
    {type:'wordblank', word:'elephant', land:'article', correct:'an'},
    {type:'word', e:'👧', w:'she', land:'subject', correct:'target'},
    {type:'word', e:'👨‍👩‍👧', w:'us', land:'object', correct:'target'},
    {type:'sentenceblank', sentence:'___ birds are singing beautifully.', hint:'멀리 있는 것 여러 개', land:'demonstrative', correct:'Those'},
    {type:'wordblank', word:'snake', land:'article', correct:'a'}
  ];

  /* ================= progress ================= */
  function defaultProgress(){ return {subject:0, object:0, demonstrative:0, article:0, bonus:0}; }
  var progress = loadProgress();
  function loadProgress(){
    try{ if (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.progress) return window.claude.hot.data.progress; }catch(e){}
    try{ var raw = localStorage.getItem('posBook2ProgressV1'); if (raw) return JSON.parse(raw); }catch(e){}
    return defaultProgress();
  }
  function saveProgress(){
    try{ localStorage.setItem('posBook2ProgressV1', JSON.stringify(progress)); }catch(e){}
    try{ if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {progress:progress}; }); }catch(e){}
  }

  var STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17l-6.1 3.5 1.5-6.8L2.2 9l6.9-.7z" fill="__C__"/></svg>';
  function starSvg(filled){ return STAR_SVG.replace('__C__', filled ? '#E369C9' : '#EFE3D1'); }

  function confetti(x, y){
    var colors = ['#4FB8E8','#FFA94D','#5FCB7A','#E369C9'];
    for (var i=0;i<26;i++){
      var el = document.createElement('div');
      el.className = 'confetti';
      var ang = Math.random()*Math.PI*2, dist = 60+Math.random()*110;
      el.style.setProperty('--dx', Math.cos(ang)*dist+'px');
      el.style.setProperty('--dy', (Math.sin(ang)*dist - 40)+'px');
      el.style.setProperty('--rot', (Math.random()*360)+'deg');
      el.style.left = x+'px'; el.style.top = y+'px';
      el.style.background = colors[i%colors.length];
      document.body.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 1200); })(el);
    }
  }

  /* ================= home render ================= */
  var shelf = document.getElementById('shelf');
  var bonusCard = document.getElementById('bonusCard');
  var homeBubble = document.getElementById('homeBubble');
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');

  function renderHome(){
    shelf.innerHTML = '';
    LAND_ORDER.forEach(function(key){
      var land = LANDS[key];
      var s = progress[key]||0;
      var btn = document.createElement('button');
      btn.className = 'landCard'+(s>0?' done':'');
      btn.style.setProperty('--c','var(--'+land.color+')');
      btn.style.setProperty('--cd','var(--'+land.color+'-deep)');
      btn.style.setProperty('--cs','var(--'+land.color+'-soft)');
      btn.innerHTML =
        '<div class="cover">'+ICONS[land.icon]+
        '<div class="coverTitle">'+land.title+'<span>'+land.sub+'</span></div></div>'+
        '<div class="footer"><span class="num">'+(s>0?'다 읽었어요':'그림책 열기')+'</span>'+
        '<span class="sticker">'+(s>0?'⭐':'☆')+'</span></div>';
      btn.onclick = function(){ openLand(key); };
      shelf.appendChild(btn);
    });
    var doneCount = LAND_ORDER.filter(function(k){ return (progress[k]||0)>0; }).length;
    var allDone = doneCount === LAND_ORDER.length;
    bonusCard.classList.toggle('unlocked', allDone);
    bonusCard.disabled = !allDone;
    if (allDone){
      bonusCard.innerHTML = '<span class="star">'+(progress.bonus>0?'🏆':'⭐')+'</span><span>'+(progress.bonus>0?'한 번에 맞히기 다시 하기':'한 번에 맞히기! 눌러서 도전해요')+'</span>';
      bonusCard.onclick = openBonus;
      homeBubble.textContent = progress.bonus>0 ? '와, 네 가지를 모두 완벽하게 익혔구나! 정말 멋져!' : '그림책 네 권을 다 읽었어! 이제 한 번에 맞혀볼까?';
    } else {
      bonusCard.innerHTML = '<span class="star">⭐</span><span>네 권을 다 읽으면 \'한 번에 맞히기\'가 열려요!</span>';
      bonusCard.onclick = null;
      homeBubble.textContent = doneCount===0 ? '또 왔구나! 이번엔 Pronoun과 Article 친구들을 만나보자!' : '잘하고 있어! 남은 그림책도 같이 읽어보자.';
    }
  }

  /* ================= learn flow ================= */
  function openLand(key){
    renderLearn(key, 0);
    overlay.classList.add('open');
  }

  function renderLearn(key, idx){
    var land = LANDS[key];
    var cards = land.learn;
    panel.innerHTML = '';
    panel.style.setProperty('--c','var(--'+land.color+')');
    panel.style.setProperty('--cd','var(--'+land.color+'-deep)');
    panel.style.setProperty('--cs','var(--'+land.color+'-soft)');

    var head = document.createElement('div');
    head.innerHTML =
      '<div class="panel-head"><h2>'+land.title+' 그림책</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>'+
      '<p class="panel-sub">배워요 · '+(idx+1)+' / '+cards.length+'</p>';
    panel.appendChild(head);

    var stage = document.createElement('div');
    stage.id = 'stage';
    var c = cards[idx];
    var html = '<div class="learnCard">';
    if (c.art) html += '<div class="stageArt">'+c.art+'</div><div class="say">'+c.say+'</div>';
    if (c.demoGrid){
      html += '<div class="say">'+c.defLine+'</div>'+
        '<div class="demoGrid">'+
          '<div class="demoCell"><div class="dt">This</div><div class="dd">가까이 + 하나</div></div>'+
          '<div class="demoCell"><div class="dt">That</div><div class="dd">멀리 + 하나</div></div>'+
          '<div class="demoCell"><div class="dt">These</div><div class="dd">가까이 + 여럿</div></div>'+
          '<div class="demoCell"><div class="dt">Those</div><div class="dd">멀리 + 여럿</div></div>'+
        '</div>';
    } else if (c.defLine){
      html += '<div class="say">'+c.defLine+'</div><div class="exGrid">';
      c.examples.forEach(function(ex){ html += '<div class="exCard"><div class="e">'+ex.e+'</div><div class="w">'+ex.w+'</div></div>'; });
      html += '</div>';
    }
    if (c.sentence){
      html += '<div class="sentence">'+c.sentence+'</div><div class="say" style="font-size:19px;">'+c.sentNote+'</div>'+
        '<div class="recap">'+c.recap+'</div>';
    }
    var dots = '<div class="dots">';
    for (var i=0;i<cards.length;i++) dots += '<span class="'+(i===idx?'on':'')+'"></span>';
    dots += '</div>';
    html += dots + '</div>';
    stage.innerHTML = html;
    panel.appendChild(stage);

    var nextBtn = document.createElement('button');
    nextBtn.className = 'bigNextBtn';
    nextBtn.textContent = (idx === cards.length-1) ? '연습하러 가기 →' : '다음 →';
    nextBtn.onclick = function(){
      if (idx === cards.length-1) startPractice(key);
      else renderLearn(key, idx+1);
    };
    panel.appendChild(nextBtn);

    document.getElementById('closeBtn').onclick = closeAll;
  }

  /* ================= card + feedback builders ================= */
  function buildCardHtml(it){
    if (it.type === 'defquestion'){
      return '<div class="practiceCard sentenceMode"><div class="qLabel">다음 설명에 알맞은 것은?</div><div class="sent">'+it.question+'</div></div>';
    }
    if (it.type === 'sentence'){
      return '<div class="practiceCard sentenceMode"><div class="qLabel">이 문장에서</div><div class="sent">'+it.sentence+'</div><div class="qLabel">밑줄 친 낱말은 무엇일까요?</div></div>';
    }
    if (it.type === 'sentenceblank'){
      var withBlank = it.sentence.replace('___', '<span class="blank">___</span>');
      return '<div class="practiceCard sentenceMode"><div class="sent">'+withBlank+'</div>'+(it.hint?'<div class="hint">('+it.hint+')</div>':'')+'</div>';
    }
    if (it.type === 'wordblank'){
      return '<div class="practiceCard blankMode"><div class="blankWord"><span class="u">___</span> <b>'+it.word+'</b></div></div>';
    }
    return '<div class="practiceCard"><div class="e">'+it.e+'</div><div class="w">'+it.w+'</div></div>';
  }
  function wrongFeedback(it, correctLabel){
    if (it.type === 'sentence' || it.type === 'word'){
      var subj = it.w || '';
      return subj + '는 ' + correctLabel + '예요. 다음엔 맞힐 수 있어요!';
    }
    return '정답은 ‘' + correctLabel + '’예요. 다음엔 맞힐 수 있어요!';
  }

  /* ================= practice flow (generic N-way) ================= */
  function startPractice(key){
    var land = LANDS[key];
    var items = land.practice.items;
    var answers = land.practice.answers;
    var idx = 0, correct = 0;
    renderQ();

    function renderQ(){
      panel.innerHTML = '';
      var head = document.createElement('div');
      head.innerHTML =
        '<div class="panel-head"><h2>'+land.title+' 연습</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>'+
        '<p class="panel-sub">'+land.practice.prompt+'</p>';
      panel.appendChild(head);

      var stage = document.createElement('div');
      stage.id = 'stage';
      var it = items[idx];
      var rowClass = 'answerRow' + (answers.length===4?' four':'') + (answers.length===3?' three':'');
      var btnsHtml = answers.map(function(a){
        return '<button class="ansBtn'+(a.icon?'':' simple')+'" data-key="'+a.key+'" style="--c:var(--'+land.color+'); --cd:var(--'+land.color+'-deep); --cs:var(--'+land.color+'-soft);">'+
          (a.icon?'<span class="ic">'+a.icon+'</span>':'')+
          '<span>'+a.label+'</span>'+
          (a.sub?'<span class="sub">'+a.sub+'</span>':'')+
          '</button>';
      }).join('');
      stage.innerHTML =
        '<div class="qn">문제 '+(idx+1)+' / '+items.length+'</div>'+
        buildCardHtml(it)+
        '<div class="'+rowClass+'" id="ansRow">'+btnsHtml+'</div>'+
        '<div class="fb" id="fb"></div>';
      panel.appendChild(stage);
      document.getElementById('closeBtn').onclick = closeAll;

      Array.prototype.forEach.call(stage.querySelectorAll('.ansBtn'), function(b){
        b.onclick = function(){ choose(b.getAttribute('data-key'), b); };
      });

      function choose(pick, btn){
        var btns = stage.querySelectorAll('.ansBtn');
        Array.prototype.forEach.call(btns, function(b){
          b.disabled = true;
          if (b.getAttribute('data-key') === it.correct) b.classList.add('correct');
          else if (b === btn) b.classList.add('wrong');
        });
        var correctAns = answers.filter(function(a){ return a.key === it.correct; })[0];
        var fb = document.getElementById('fb');
        if (pick === it.correct){
          correct++;
          fb.textContent = '정답이에요! 참 잘했어요 ✨'; fb.style.color = '#1EA294';
          var r = btn.getBoundingClientRect();
          confetti(r.left+r.width/2, r.top+r.height/2);
        } else {
          fb.textContent = wrongFeedback(it, correctAns.label);
          fb.style.color = '#C23B5B';
        }
        var next = document.createElement('button');
        next.className = 'bigNextBtn';
        next.style.marginTop = '14px';
        next.style.setProperty('--c','var(--'+land.color+')');
        next.style.setProperty('--cd','var(--'+land.color+'-deep)');
        next.textContent = (idx===items.length-1) ? '결과 보기 →' : '다음 →';
        next.onclick = function(){ idx++; if (idx>=items.length) finish(); else renderQ(); };
        panel.appendChild(next);
      }
    }
    function finish(){
      var pct = correct/items.length;
      var stars = pct>=0.9 ? 3 : (pct>=0.6 ? 2 : 1);
      showReward(key, correct, items.length, stars);
    }
  }

  /* ================= sticker reward page ================= */
  function showReward(key, correct, total, stars){
    var land = LANDS[key];
    if ((progress[key]||0) < stars){ progress[key] = stars; saveProgress(); }
    panel.innerHTML = '';
    var head = document.createElement('div');
    head.innerHTML = '<div class="panel-head"><h2>'+land.title+' 완료!</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>';
    panel.appendChild(head);
    var stage = document.createElement('div');
    stage.id = 'stage';
    stage.innerHTML =
      '<div class="rewardPage">'+
      '<div class="stickerBig">⭐</div>'+
      '<h3>'+land.title+' 스티커 획득!</h3>'+
      '<div class="starsRow">'+[1,2,3].map(function(i){return starSvg(i<=stars);}).join('')+'</div>'+
      '<p>'+correct+' / '+total+'개를 맞혔어요. '+rewardMsg(stars)+'</p>'+
      '<button class="bigNextBtn" id="rewardBackBtn" style="--c:var(--'+land.color+'); --cd:var(--'+land.color+'-deep);">그림책으로 돌아가기</button>'+
      '</div>';
    panel.appendChild(stage);
    document.getElementById('closeBtn').onclick = closeAll;
    document.getElementById('rewardBackBtn').onclick = closeAll;
    setTimeout(function(){
      var r = stage.querySelector('.stickerBig').getBoundingClientRect();
      confetti(r.left+r.width/2, r.top+r.height/2);
    }, 150);
  }
  function rewardMsg(stars){
    if (stars>=3) return '완벽해요! 토실이가 정말 자랑스러워해요.';
    if (stars===2) return '아주 잘했어요! 한 번 더 하면 완벽해질 거예요.';
    return '스티커를 모았어요! 다시 읽어보면 더 쉬워질 거예요.';
  }

  /* ================= bonus round (mixed types, 2/4-way per item using its own land's answers) ================= */
  function openBonus(){
    var idx = 0, correct = 0;
    overlay.classList.add('open');
    renderQ();
    function renderQ(){
      panel.innerHTML = '';
      panel.style.setProperty('--c','var(--art)');
      panel.style.setProperty('--cd','var(--art-deep)');
      var head = document.createElement('div');
      head.innerHTML =
        '<div class="panel-head"><h2>한 번에 맞히기</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>'+
        '<p class="panel-sub">Subject·Object Pronoun, This/That/These/Those, a·an·the를 모두 섞어서 풀어 봐요!</p>';
      panel.appendChild(head);
      var stage = document.createElement('div');
      stage.id = 'stage';
      var it = BONUS_ITEMS[idx];
      var land = LANDS[it.land];
      var answers = land.practice.answers;
      var rowClass = 'answerRow' + (answers.length===4?' four':'') + (answers.length===3?' three':'');
      var btnsHtml = answers.map(function(a){
        return '<button class="ansBtn'+(a.icon?'':' simple')+'" data-key="'+a.key+'" style="--c:var(--'+land.color+'); --cd:var(--'+land.color+'-deep); --cs:var(--'+land.color+'-soft);">'+
          (a.icon?'<span class="ic">'+a.icon+'</span>':'')+
          '<span>'+a.label+'</span>'+
          (a.sub?'<span class="sub">'+a.sub+'</span>':'')+
          '</button>';
      }).join('');
      stage.innerHTML =
        '<div class="qn">문제 '+(idx+1)+' / '+BONUS_ITEMS.length+' &middot; '+land.title+'</div>'+
        buildCardHtml(it)+
        '<div class="'+rowClass+'" id="ansRow">'+btnsHtml+'</div>'+
        '<div class="fb" id="fb"></div>';
      panel.appendChild(stage);
      document.getElementById('closeBtn').onclick = closeAll;

      Array.prototype.forEach.call(stage.querySelectorAll('.ansBtn'), function(b){
        b.onclick = function(){ choose(b.getAttribute('data-key'), b); };
      });

      function choose(pick, btn){
        Array.prototype.forEach.call(stage.querySelectorAll('.ansBtn'), function(b){
          b.disabled = true;
          if (b.getAttribute('data-key') === it.correct) b.classList.add('correct');
          else if (b === btn) b.classList.add('wrong');
        });
        var correctAns = answers.filter(function(a){ return a.key === it.correct; })[0];
        var fb = document.getElementById('fb');
        if (pick === it.correct){
          correct++;
          fb.textContent = '정답이에요! ✨'; fb.style.color = '#1EA294';
          var r = btn.getBoundingClientRect();
          confetti(r.left+r.width/2, r.top+r.height/2);
        } else {
          fb.textContent = wrongFeedback(it, correctAns.label);
          fb.style.color = '#C23B5B';
        }
        var next = document.createElement('button');
        next.className = 'bigNextBtn';
        next.style.marginTop = '14px';
        next.textContent = (idx===BONUS_ITEMS.length-1) ? '결과 보기 →' : '다음 →';
        next.onclick = function(){ idx++; if (idx>=BONUS_ITEMS.length) finish(); else renderQ(); };
        panel.appendChild(next);
      }
    }
    function finish(){
      var pct = correct/BONUS_ITEMS.length;
      var stars = pct>=0.9 ? 3 : (pct>=0.6 ? 2 : 1);
      if ((progress.bonus||0) < stars){ progress.bonus = stars; saveProgress(); }
      panel.innerHTML = '';
      var head = document.createElement('div');
      head.innerHTML = '<div class="panel-head"><h2>도전 완료!</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>';
      panel.appendChild(head);
      var stage = document.createElement('div'); stage.id='stage';
      stage.innerHTML =
        '<div class="rewardPage">'+
        '<div class="stickerBig">🏆</div>'+
        '<h3>최고예요!</h3>'+
        '<div class="starsRow">'+[1,2,3].map(function(i){return starSvg(i<=stars);}).join('')+'</div>'+
        '<p>'+correct+' / '+BONUS_ITEMS.length+'개를 맞혔어요. 이제 Pronoun과 Article을 잘 구분할 수 있어요!</p>'+
        '<button class="bigNextBtn" id="rewardBackBtn" style="--c:var(--art); --cd:var(--art-deep);">그림책으로 돌아가기</button>'+
        '</div>';
      panel.appendChild(stage);
      document.getElementById('closeBtn').onclick = closeAll;
      document.getElementById('rewardBackBtn').onclick = closeAll;
      setTimeout(function(){
        var r = stage.querySelector('.stickerBig').getBoundingClientRect();
        confetti(r.left+r.width/2, r.top+r.height/2);
      }, 150);
    }
  }

  function closeAll(){ overlay.classList.remove('open'); renderHome(); }

  renderHome();

  try{
    if (window.claude && window.claude.hot){
      var boot = function(){ renderHome(); };
      if (window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
    }
  }catch(e){}
})();
</script>

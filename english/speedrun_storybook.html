<title>왕별 스피드런</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root{
  --paper:#FFF8EF;
  --card:#FFFFFF;
  --ink:#4A3B32;
  --ink-soft:#97836F;
  --ink-faint:#C3B29E;
  --line:#F0E3D1;

  --c:#FFC93C;    --c-deep:#D99A00;    --c-soft:#FFF3D0;
  --timer:#F0577A;

  --ok:#38C172;
  --font-display:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-word:'Baloo 2','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 70% 40% at 12% 0%, #FFF3D0 0%, transparent 55%),
    radial-gradient(ellipse 70% 40% at 88% 12%, #FFE4D9 0%, transparent 55%),
    radial-gradient(ellipse 60% 35% at 90% 95%, #FDE8F2 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px; margin:0 auto; padding:20px 18px 28px; position:relative; min-height:100vh; display:flex; flex-direction:column;}

header.top{display:flex; align-items:flex-start; gap:14px; margin-bottom:18px;}
.mascot{width:76px; height:76px; flex-shrink:0; filter:drop-shadow(0 4px 8px #00000014);}
.title-block h1{font-family:var(--font-display); font-weight:700; font-size:clamp(27px,7.2vw,36px); margin:2px 0 7px; color:var(--ink); text-wrap:balance;}
.bubble{position:relative; background:var(--card); border:2px solid var(--line); border-radius:16px 16px 16px 4px; padding:12px 16px; font-size:18px; color:var(--ink-soft); line-height:1.5; margin:0; box-shadow:0 3px 10px #00000008;}

/* ---------- home hero card ---------- */
.hero{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; background:var(--card); border:3px solid var(--line); border-radius:28px; padding:32px 22px; box-shadow:0 8px 20px #00000010; position:relative; overflow:hidden;}
.hero .crown{font-size:96px; line-height:1;}
.hero h2{font-family:var(--font-display); font-weight:700; font-size:26px; margin:0; color:var(--ink);}
.hero .desc{font-family:var(--font-word); font-weight:600; font-size:17px; color:var(--ink-soft); line-height:1.6; max-width:320px;}
.hero .best{display:flex; align-items:center; gap:10px; background:var(--c-soft); border-radius:16px; padding:10px 18px; font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--c-deep);}
.hero .best svg{width:22px; height:22px;}
.startBtn{margin-top:6px; width:100%; max-width:300px; padding:19px; border:none; border-radius:18px; background:var(--c); color:#fff; font-family:var(--font-display); font-weight:700; font-size:23px; cursor:pointer; box-shadow:0 5px 0 var(--c-deep);}
.startBtn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--c-deep);}

.footnote{margin-top:16px; text-align:center; color:var(--ink-faint); font-size:14.5px;}

/* ---------- full-screen panel ---------- */
.overlay{position:fixed; inset:0; z-index:20; background:#4A3B3266; backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.open{opacity:1; pointer-events:auto;}
.panel{width:100%; max-width:640px; height:93vh; height:93dvh; max-height:93vh; max-height:93dvh;
  background:
    radial-gradient(ellipse 90% 40% at 15% 0%, #FFF3D077, transparent 55%),
    radial-gradient(ellipse 90% 40% at 100% 100%, #FDE8F277, transparent 55%),
    var(--paper);
  border-radius:26px 26px 0 0; border:3px solid var(--line); border-bottom:none;
  padding:16px 18px 20px; overflow-y:auto; transform:translateY(16px); transition:transform .22s ease;
  box-shadow:0 -10px 30px #00000018; display:flex; flex-direction:column;}
.overlay.open .panel{transform:translateY(0);}
.panel-head{display:flex; align-items:center; gap:8px;}
.panel-head h2{font-family:var(--font-display); font-weight:700; font-size:23px; margin:0; color:var(--ink); flex:1;}
.iconBtn{background:var(--card); border:2px solid var(--line); color:var(--ink-soft); width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:19px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

.timerRow{display:flex; align-items:center; justify-content:center; gap:10px; margin:4px 0 2px;}
.timerRow .tnum{font-family:var(--font-word); font-weight:800; font-size:22px; color:var(--timer);}
.timerBar{height:12px; background:var(--c-soft); border-radius:8px; overflow:hidden; margin:6px 0 4px;}
.timerBar .fill{height:100%; background:var(--timer); border-radius:8px; transition:width .3s linear;}

#stage{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; overflow-y:auto; gap:2px;}

.qn{text-align:center; font-family:var(--font-word); font-weight:700; font-size:16px; color:var(--ink-faint); letter-spacing:.4px; margin-bottom:9px;}
.practiceCard{background:var(--card); border:3px solid var(--line); border-radius:26px; padding:34px 22px; text-align:center; margin:0 auto 22px; max-width:340px; box-shadow:0 6px 16px #00000010;}
.practiceCard .e{font-size:96px; line-height:1;}
.practiceCard .w{font-family:var(--font-word); font-weight:800; font-size:40px; color:var(--ink); margin-top:6px;}
.practiceCard.sentenceMode{max-width:380px; padding:24px 22px;}
.practiceCard .qLabel{font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink-faint);}
.practiceCard .sent{font-family:var(--font-word); font-weight:600; font-size:24px; color:var(--ink); line-height:1.5; margin:7px 0; text-wrap:balance;}
.practiceCard .sent b{color:var(--c-deep); text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:4px; font-weight:800;}
.practiceCard .sent .blank{display:inline-block; min-width:60px; border-bottom:3px solid var(--c-deep); color:var(--c-deep); font-weight:800;}
.practiceCard .hint{font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--c-deep); background:var(--c-soft); display:inline-block; margin-top:9px; padding:6px 14px; border-radius:13px;}
.practiceCard.blankMode .blankWord{font-family:var(--font-word); font-weight:700; font-size:34px; color:var(--ink);}

.answerRow{display:grid; grid-template-columns:1fr 1fr; gap:13px; max-width:440px; margin:0 auto; width:100%;}
.answerRow.four{grid-template-columns:1fr 1fr;}
.answerRow.three{grid-template-columns:1fr 1fr 1fr; gap:9px;}
.ansBtn{--bc:var(--c); --bd:var(--c-deep); --bs:var(--c-soft);
  font-family:var(--font-word); font-weight:700; font-size:20px; background:var(--bs); color:var(--bd);
  border:3px solid var(--bc); border-radius:17px; padding:19px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; transition:transform .1s ease;}
.ansBtn.simple{font-size:22px; padding:20px 6px;}
.answerRow.three .ansBtn.simple{font-size:20px; padding:18px 4px;}
.answerRow.four .ansBtn.simple{font-size:20px; padding:18px 4px;}
.ansBtn .ic{font-size:30px;}
.ansBtn .sub{font-size:13.5px; font-weight:600;}
.ansBtn:active{transform:scale(.96);}
.ansBtn.correct{background:var(--ok); border-color:#279656; color:#fff;}
.ansBtn.wrong{background:#FFE3E3; border-color:#F0577A; color:#C23B5B; opacity:.7;}
.ansBtn[disabled]{cursor:default;}

/* ---------- result page ---------- */
.rewardPage{text-align:center; padding:6px 4px;}
.rewardPage .stickerBig{font-size:120px; animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(0) rotate(-15deg);} 70%{transform:scale(1.15) rotate(6deg);} 100%{transform:scale(1) rotate(0);}}
.rewardPage h3{font-family:var(--font-display); font-weight:700; font-size:28px; margin:11px 0 5px; color:var(--ink);}
.rewardPage p{color:var(--ink-soft); font-size:18px; margin:4px 0 18px;}
.starsRow{display:flex; justify-content:center; gap:8px; margin:6px 0 16px;}
.starsRow svg{width:36px; height:36px;}

.confetti{position:fixed; width:9px; height:9px; border-radius:3px; pointer-events:none; z-index:60; animation:fall 1.1s ease-out forwards;}
@keyframes fall{0%{transform:translate(0,0) rotate(0deg); opacity:1;} 100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0;}}

@media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }
</style>

<div class="wrap">
  <header class="top">
    <svg class="mascot" viewBox="0 0 100 100">
      <ellipse cx="36" cy="22" rx="9" ry="22" fill="#FFF8EF" stroke="#4A3B32" stroke-width="3"/>
      <ellipse cx="64" cy="22" rx="9" ry="22" fill="#FFF8EF" stroke="#4A3B32" stroke-width="3"/>
      <ellipse cx="36" cy="24" rx="4.5" ry="13" fill="#FFC9D4"/>
      <ellipse cx="64" cy="24" rx="4.5" ry="13" fill="#FFC9D4"/>
      <circle cx="50" cy="60" r="32" fill="#FFF8EF" stroke="#4A3B32" stroke-width="3"/>
      <circle cx="30" cy="66" r="6" fill="#FFC9D4"/>
      <circle cx="70" cy="66" r="6" fill="#FFC9D4"/>
      <circle cx="40" cy="55" r="3.4" fill="#4A3B32"/>
      <circle cx="60" cy="55" r="3.4" fill="#4A3B32"/>
      <path d="M47 65 q3 3 6 0" stroke="#4A3B32" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="title-block">
      <h1>왕별 스피드런</h1>
      <p class="bubble" id="homeBubble">그림책 네 권에서 배운 걸 모두 섞어서 도전해봐요!</p>
    </div>
  </header>

  <div class="hero">
    <div class="crown">👑</div>
    <h2>왕별 스피드런</h2>
    <p class="desc">Parts of Speech·Pronouns·Vocabulary·보너스 샛길에서 배운 것을 모두 섞어서 100초 동안 풀어요. 틀려도 괜찮아요, 최대한 많이 맞혀 봐요!</p>
    <div class="best" id="bestRow" style="display:none;"></div>
    <button class="startBtn" id="startBtn">시작하기 →</button>
  </div>

  <p class="footnote">20문제를 100초 동안 풀어요 · 별 3개가 목표예요 🌟</p>
</div>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script>
(function(){
  "use strict";

  var TOTAL_TIME = 100; // seconds

  /* ================= mixed question pool (verified against the four sibling picture books) ================= */
  var ITEMS = [
    {type:'word', w:'cat', correct:'noun', answers:[{key:'noun',label:'Noun'},{key:'verb',label:'Verb'}]},
    {type:'word', w:'run', correct:'verb', answers:[{key:'noun',label:'Noun'},{key:'verb',label:'Verb'}]},
    {type:'sentence', sentence:'He eats the <b>red</b> apple.', qLabel:'밑줄 친 낱말은?', correct:'adj', answers:[{key:'adj',label:'Adjective'},{key:'adv',label:'Adverb'}]},
    {type:'sentence', sentence:'He runs <b>quickly</b>.', qLabel:'밑줄 친 낱말은?', correct:'adv', answers:[{key:'adj',label:'Adjective'},{key:'adv',label:'Adverb'}]},
    {type:'word', w:'she', correct:'subj', answers:[{key:'subj',label:'Subject Pronoun'},{key:'nounx',label:'Noun'}]},
    {type:'word', w:'him', correct:'obj', answers:[{key:'obj',label:'Object Pronoun'},{key:'subj2',label:'Subject Pronoun'}]},
    {type:'sentenceblank', sentence:'___ book is interesting.', hint:'가까이 있는 것 하나', correct:'This', answers:[{key:'This',label:'This'},{key:'That',label:'That'},{key:'These',label:'These'},{key:'Those',label:'Those'}]},
    {type:'wordblank', word:'grape', correct:'a', answers:[{key:'a',label:'a'},{key:'an',label:'an'},{key:'the',label:'the'}]},
    {type:'word', w:'rethink', correct:'yes1', answers:[{key:'yes1',label:'Re-가 있어요'},{key:'no1',label:'Re-가 없어요'}]},
    {type:'word', w:'unhappy', correct:'yes2', answers:[{key:'yes2',label:'Un-이 있어요'},{key:'no2',label:'Un-이 없어요'}]},
    {type:'word', w:'quickly', correct:'yes3', answers:[{key:'yes3',label:'-ly가 있어요'},{key:'no3',label:'-ly가 없어요'}]},
    {type:'rootword', word:'movement', correct:'move', answers:[{key:'move',label:'move'},{key:'moving',label:'moving'},{key:'moved',label:'moved'}]},
    {type:'sentenceblank', sentence:'He ___ soccer.', hint:'(play)', correct:'plays', answers:[{key:'plays',label:'plays'},{key:'play',label:'play'}]},
    {type:'rootword', word:'baby', correct:'babies', answers:[{key:'babies',label:'babies'},{key:'babys',label:'babys'},{key:'babyes',label:'babyes'}]},
    {type:'sentenceblank', sentence:'Tom and I eat dinner. → ___ eat dinner.', hint:'(주어 자리)', correct:'We', answers:[{key:'We',label:'We'},{key:'They',label:'They'},{key:'You',label:'You'},{key:'He',label:'He'}]},
    {type:'sentenceblank', sentence:'___ apples are delicious.', hint:'가까이 있는 것 여러 개', correct:'These', answers:[{key:'This',label:'This'},{key:'That',label:'That'},{key:'These',label:'These'},{key:'Those',label:'Those'}]},
    {type:'defquestion', question:'사람, 동물, 사물의 이름을 나타내는 낱말은 무엇일까요?', correct:'noun', answers:[{key:'noun',label:'Noun'},{key:'verb',label:'Verb'}]},
    {type:'defquestion', question:'가까이 있는 것 하나를 가리키는 말은 무엇일까요?', correct:'This', answers:[{key:'This',label:'This'},{key:'That',label:'That'},{key:'These',label:'These'},{key:'Those',label:'Those'}]},
    {type:'defquestion', question:'주어가 He·She·It일 때 동사 끝에 -s나 -es를 붙이는 규칙을 무엇이라고 부를까요?', correct:'sva', answers:[{key:'sva',label:'Subject-Verb Agreement'},{key:'other',label:'Plural'}]},
    {type:'defquestion', question:'‘cats’처럼 여러 개를 나타내는 명사를 무엇이라고 부를까요?', correct:'plural', answers:[{key:'plural',label:'Plural Noun'},{key:'singular',label:'Singular Noun'}]}
  ];

  /* ================= progress (best record) ================= */
  function defaultProgress(){ return {bestStars:0, bestScore:0}; }
  var progress = loadProgress();
  function loadProgress(){
    try{ if (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.progress) return window.claude.hot.data.progress; }catch(e){}
    try{ var raw = localStorage.getItem('speedRunProgressV1'); if (raw) return JSON.parse(raw); }catch(e){}
    return defaultProgress();
  }
  function saveProgress(){
    try{ localStorage.setItem('speedRunProgressV1', JSON.stringify(progress)); }catch(e){}
    try{ if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {progress:progress}; }); }catch(e){}
  }

  var STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17l-6.1 3.5 1.5-6.8L2.2 9l6.9-.7z" fill="__C__"/></svg>';
  function starSvg(filled){ return STAR_SVG.replace('__C__', filled ? '#FFC93C' : '#EFE3D1'); }

  function confetti(x, y){
    var colors = ['#FFC93C','#F0577A','#5B8DEF','#38C172'];
    for (var i=0;i<26;i++){
      var el = document.createElement('div');
      el.className = 'confetti';
      var ang = Math.random()*Math.PI*2, dist = 60+Math.random()*110;
      el.style.setProperty('--dx', Math.cos(ang)*dist+'px');
      el.style.setProperty('--dy', (Math.sin(ang)*dist - 40)+'px');
      el.style.setProperty('--rot', (Math.random()*360)+'deg');
      el.style.left = x+'px'; el.style.top = y+'px';
      el.style.background = colors[i%colors.length];
      document.body.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 1200); })(el);
    }
  }

  /* ================= home render ================= */
  var bestRow = document.getElementById('bestRow');
  var homeBubble = document.getElementById('homeBubble');
  var startBtn = document.getElementById('startBtn');
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');

  function renderHome(){
    if (progress.bestStars > 0){
      bestRow.style.display = 'flex';
      bestRow.innerHTML = [1,2,3].map(function(i){return starSvg(i<=progress.bestStars);}).join('') + '<span>최고 기록 ' + progress.bestScore + ' / ' + ITEMS.length + '개</span>';
      homeBubble.textContent = '이번엔 최고 기록을 깨볼까?';
    } else {
      bestRow.style.display = 'none';
      homeBubble.textContent = '그림책 네 권에서 배운 걸 모두 섞어서 도전해봐요!';
    }
  }
  startBtn.onclick = function(){ overlay.classList.add('open'); startRun(); };

  /* ================= card builder (shared across all question types) ================= */
  function buildCardHtml(it){
    if (it.type === 'defquestion'){
      return '<div class="practiceCard sentenceMode"><div class="qLabel">다음 설명에 알맞은 것은?</div><div class="sent">'+it.question+'</div></div>';
    }
    if (it.type === 'sentence'){
      return '<div class="practiceCard sentenceMode"><div class="qLabel">'+(it.qLabel||'이 문장에서')+'</div><div class="sent">'+it.sentence+'</div></div>';
    }
    if (it.type === 'sentenceblank'){
      var withBlank = it.sentence.replace('___', '<span class="blank">___</span>');
      return '<div class="practiceCard sentenceMode"><div class="sent">'+withBlank+'</div>'+(it.hint?'<div class="hint">('+it.hint+')</div>':'')+'</div>';
    }
    if (it.type === 'wordblank'){
      return '<div class="practiceCard blankMode"><div class="blankWord"><span style="border-bottom:3px solid var(--c-deep); display:inline-block; min-width:56px;">&nbsp;</span> <b>'+it.word+'</b></div></div>';
    }
    if (it.type === 'rootword'){
      return '<div class="practiceCard blankMode"><div class="blankWord">'+it.word+'</div></div>';
    }
    return '<div class="practiceCard"><div class="w">'+(it.w||'')+'</div></div>';
  }

  /* ================= timed run ================= */
  var timeLeft, timerId, idx, correctCount;

  function startRun(){
    idx = 0; correctCount = 0; timeLeft = TOTAL_TIME;
    renderQ();
    timerId = setInterval(function(){
      timeLeft -= 1;
      updateTimerDisplay();
      if (timeLeft <= 0){ clearInterval(timerId); finish(); }
    }, 1000);
  }

  function updateTimerDisplay(){
    var tnum = document.getElementById('tnum');
    var fill = document.getElementById('timerFill');
    if (tnum) tnum.textContent = timeLeft + '초';
    if (fill) fill.style.width = Math.max(0, (timeLeft/TOTAL_TIME*100)) + '%';
  }

  function renderQ(){
    panel.innerHTML = '';
    var head = document.createElement('div');
    head.innerHTML =
      '<div class="panel-head"><h2>👑 왕별 스피드런</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>'+
      '<div class="timerRow"><span class="tnum" id="tnum">'+timeLeft+'초</span></div>'+
      '<div class="timerBar"><div class="fill" id="timerFill" style="width:'+(timeLeft/TOTAL_TIME*100)+'%;"></div></div>';
    panel.appendChild(head);

    var stage = document.createElement('div');
    stage.id = 'stage';
    var it = ITEMS[idx];
    var answers = it.answers;
    var rowClass = 'answerRow' + (answers.length===4?' four':'') + (answers.length===3?' three':'');
    var btnsHtml = answers.map(function(a){
      return '<button class="ansBtn'+(a.icon?'':' simple')+'" data-key="'+a.key+'">'+
        (a.icon?'<span class="ic">'+a.icon+'</span>':'')+
        '<span>'+a.label+'</span>'+
        (a.sub?'<span class="sub">'+a.sub+'</span>':'')+
        '</button>';
    }).join('');
    stage.innerHTML =
      '<div class="qn">문제 '+(idx+1)+' / '+ITEMS.length+' &middot; 맞힌 개수 '+correctCount+'</div>'+
      buildCardHtml(it)+
      '<div class="'+rowClass+'" id="ansRow">'+btnsHtml+'</div>';
    panel.appendChild(stage);
    document.getElementById('closeBtn').onclick = closeRun;

    Array.prototype.forEach.call(stage.querySelectorAll('.ansBtn'), function(b){
      b.onclick = function(){ choose(b.getAttribute('data-key'), b); };
    });

    function choose(pick, btn){
      var btns = stage.querySelectorAll('.ansBtn');
      Array.prototype.forEach.call(btns, function(b){
        b.disabled = true;
        if (b.getAttribute('data-key') === it.correct) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
      });
      if (pick === it.correct){
        correctCount++;
        var r = btn.getBoundingClientRect();
        confetti(r.left+r.width/2, r.top+r.height/2);
      }
      setTimeout(function(){
        idx++;
        if (idx >= ITEMS.length){ clearInterval(timerId); finish(); }
        else renderQ();
      }, 450);
    }
  }

  function closeRun(){
    clearInterval(timerId);
    overlay.classList.remove('open');
    renderHome();
  }

  function finish(){
    var pct = correctCount/ITEMS.length;
    var stars = pct>=0.9 ? 3 : (pct>=0.6 ? 2 : (pct>=0.3 ? 1 : 0));
    if (stars > (progress.bestStars||0) || (stars === (progress.bestStars||0) && correctCount > (progress.bestScore||0))){
      progress.bestStars = stars; progress.bestScore = correctCount; saveProgress();
    }
    panel.innerHTML = '';
    var head = document.createElement('div');
    head.innerHTML = '<div class="panel-head"><h2>도전 완료!</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>';
    panel.appendChild(head);
    var stage = document.createElement('div'); stage.id='stage';
    stage.innerHTML =
      '<div class="rewardPage">'+
      '<div class="stickerBig">'+(stars>=3?'👑':'⭐')+'</div>'+
      '<h3>'+resultTitle(stars)+'</h3>'+
      '<div class="starsRow">'+[1,2,3].map(function(i){return starSvg(i<=stars);}).join('')+'</div>'+
      '<p>'+correctCount+' / '+ITEMS.length+'개를 맞혔어요. '+resultMsg(stars)+'</p>'+
      '<button class="startBtn" id="rewardBackBtn" style="max-width:none;">그림책으로 돌아가기</button>'+
      '</div>';
    panel.appendChild(stage);
    document.getElementById('closeBtn').onclick = closeRun;
    document.getElementById('rewardBackBtn').onclick = closeRun;
    setTimeout(function(){
      var r = stage.querySelector('.stickerBig').getBoundingClientRect();
      confetti(r.left+r.width/2, r.top+r.height/2);
    }, 150);
  }
  function resultTitle(stars){
    if (stars>=3) return '왕별 등극!';
    if (stars===2) return '참 잘했어요!';
    if (stars===1) return '좋은 시작이에요!';
    return '다시 도전해요!';
  }
  function resultMsg(stars){
    if (stars>=3) return '완벽해요! 토실이가 정말 자랑스러워해요.';
    if (stars===2) return '아주 잘했어요! 한 번 더 하면 왕별이 될 거예요.';
    if (stars===1) return '잘하고 있어요! 그림책을 다시 읽고 한 번 더 도전해봐요.';
    return '괜찮아요, 연습하면 더 잘할 수 있어요!';
  }

  renderHome();

  try{
    if (window.claude && window.claude.hot){
      var boot = function(){ renderHome(); };
      if (window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
    }
  }catch(e){}
})();
</script>

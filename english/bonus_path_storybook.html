<title>보너스 샛길 그림책</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root{
  --paper:#FFF8EF;
  --card:#FFFFFF;
  --ink:#4A3B32;
  --ink-soft:#97836F;
  --ink-faint:#C3B29E;
  --line:#F0E3D1;

  --verb:#5B8DEF;    --verb-deep:#3763C9;    --verb-soft:#E2EAFC;
  --plural:#F2994A;  --plural-deep:#C96F1E;  --plural-soft:#FEEBD9;
  --pronoun:#BD5FCB; --pronoun-deep:#8E36A0; --pronoun-soft:#F6E3FA;

  --ok:#38C172;
  --font-display:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-word:'Baloo 2','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 70% 40% at 12% 0%, #E2EAFC 0%, transparent 55%),
    radial-gradient(ellipse 70% 40% at 88% 12%, #FEEBD9 0%, transparent 55%),
    radial-gradient(ellipse 60% 35% at 90% 95%, #F6E3FA 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px; margin:0 auto; padding:20px 18px 28px; position:relative; min-height:100vh; display:flex; flex-direction:column;}

/* ---------- header / mascot ---------- */
header.top{display:flex; align-items:flex-start; gap:14px; margin-bottom:18px;}
.mascot{width:76px; height:76px; flex-shrink:0; filter:drop-shadow(0 4px 8px #00000014);}
.title-block h1{font-family:var(--font-display); font-weight:700; font-size:clamp(25px,6.8vw,34px); margin:2px 0 7px; color:var(--ink); text-wrap:balance;}
.bubble{position:relative; background:var(--card); border:2px solid var(--line); border-radius:16px 16px 16px 4px; padding:12px 16px; font-size:18px; color:var(--ink-soft); line-height:1.5; margin:0; box-shadow:0 3px 10px #00000008;}

/* ---------- home shelf ---------- */
.shelf{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:4px; flex:1;}
@media (max-width:380px){ .shelf{grid-template-columns:1fr;} }
.landCard{
  --c:var(--verb); --cd:var(--verb-deep); --cs:var(--verb-soft);
  position:relative; border:none; cursor:pointer; text-align:left; padding:0;
  background:var(--card); border-radius:24px; border:3px solid var(--line);
  overflow:hidden; min-height:236px; display:flex; flex-direction:column;
  box-shadow:0 6px 16px #00000010; transition:transform .12s ease;
}
.landCard:active{transform:scale(.97);}
.landCard .cover{flex:1; background:var(--cs); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:13px; padding:18px 10px; position:relative;}
.landCard .cover svg{width:60px; height:60px;}
.landCard .coverTitle{font-family:var(--font-word); font-weight:800; font-size:23px; color:var(--cd); text-align:center; line-height:1.15;}
.landCard .coverTitle span{display:block; font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--ink-soft); margin-top:4px;}
.landCard .footer{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--card);}
.landCard .footer .num{font-family:var(--font-word); font-weight:700; font-size:16px; color:var(--ink-faint); letter-spacing:.5px;}
.landCard .sticker{font-size:26px; line-height:1;}
.landCard.done{border-color:var(--c);}
.landCard.wide{grid-column:1 / -1;}

.bonusCard{margin-top:16px; border:3px dashed var(--ink-faint); border-radius:20px; background:transparent; padding:20px; display:flex; align-items:center; justify-content:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--ink-faint); cursor:default; text-align:center;}
.bonusCard .star{font-size:28px;}
.bonusCard.unlocked{cursor:pointer; border-style:solid; border-color:var(--pronoun); background:var(--pronoun-soft); color:var(--pronoun-deep);}
.bonusCard.unlocked:active{transform:scale(.98);}

.footnote{margin-top:16px; text-align:center; color:var(--ink-faint); font-size:14.5px;}

/* ---------- full-screen panel ---------- */
.overlay{position:fixed; inset:0; z-index:20; background:#4A3B3266; backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.open{opacity:1; pointer-events:auto;}
.panel{width:100%; max-width:640px; height:93vh; height:93dvh; max-height:93vh; max-height:93dvh;
  background:
    radial-gradient(ellipse 90% 40% at 15% 0%, #E2EAFC77, transparent 55%),
    radial-gradient(ellipse 90% 40% at 100% 100%, #F6E3FA77, transparent 55%),
    var(--paper);
  border-radius:26px 26px 0 0; border:3px solid var(--line); border-bottom:none;
  padding:16px 18px 20px; overflow-y:auto; transform:translateY(16px); transition:transform .22s ease;
  box-shadow:0 -10px 30px #00000018; display:flex; flex-direction:column;}
.overlay.open .panel{transform:translateY(0);}
.panel-head{display:flex; align-items:center; gap:8px;}
.panel-head h2{font-family:var(--font-display); font-weight:700; font-size:25px; margin:0; color:var(--ink); flex:1;}
.panel-sub{font-size:16.5px; color:var(--ink-faint); margin:3px 0 8px; font-family:var(--font-word); font-weight:600; letter-spacing:.3px;}
.iconBtn{background:var(--card); border:2px solid var(--line); color:var(--ink-soft); width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:19px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

#stage{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; overflow-y:auto; gap:2px;}

/* ---------- learn cards ---------- */
.learnCard{display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px; padding:10px 4px;}
.learnCard .stageArt{font-size:88px; line-height:1;}
.learnCard .exGrid{display:flex; gap:15px; flex-wrap:wrap; justify-content:center;}
.exGrid .exCard{background:var(--card); border:2.5px solid var(--line); border-radius:18px; padding:16px 18px; min-width:100px; box-shadow:0 4px 10px #00000008;}
.exGrid .exCard .e{font-size:46px;}
.exGrid .exCard .w{font-family:var(--font-word); font-weight:700; font-size:18px; margin-top:5px; color:var(--ink);}
.learnCard .say{font-family:var(--font-display); font-weight:700; font-size:26px; line-height:1.5; color:var(--ink); text-wrap:balance; max-width:420px;}
.learnCard .sentence{font-family:var(--font-word); font-weight:600; font-size:23px; color:var(--ink-soft); background:var(--card); border:2px dashed var(--ink-faint); border-radius:14px; padding:14px 20px;}
.learnCard .sentence b{color:var(--cd,var(--verb-deep));}
.learnCard .recap{font-family:var(--font-display); font-weight:700; font-size:19px; padding:11px 20px; border-radius:18px; background:var(--cs,var(--verb-soft)); color:var(--cd,var(--verb-deep)); line-height:1.5;}
.dots{display:flex; gap:6px; justify-content:center; margin:2px 0 0;}
.dots span{width:9px; height:9px; border-radius:50%; background:var(--line);}
.dots span.on{background:var(--c,var(--verb));}
.bigNextBtn{margin-top:8px; width:100%; padding:18px; border:none; border-radius:16px; background:var(--c,var(--verb)); color:#fff; font-family:var(--font-display); font-weight:700; font-size:21px; cursor:pointer; box-shadow:0 5px 0 var(--cd,var(--verb-deep));}
.bigNextBtn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--cd,var(--verb-deep));}

/* ---------- practice ---------- */
.qn{text-align:center; font-family:var(--font-word); font-weight:700; font-size:16px; color:var(--ink-faint); letter-spacing:.4px; margin-bottom:9px;}
.practiceCard{background:var(--card); border:3px solid var(--line); border-radius:26px; padding:38px 22px; text-align:center; margin:0 auto 24px; max-width:340px; box-shadow:0 6px 16px #00000010;}
.practiceCard.sentenceMode{max-width:380px; padding:26px 22px;}
.practiceCard .qLabel{font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--ink-faint);}
.practiceCard .sent{font-family:var(--font-word); font-weight:600; font-size:26px; color:var(--ink); line-height:1.55; margin:8px 0; text-wrap:balance;}
.practiceCard .sent .blank{display:inline-block; min-width:64px; border-bottom:3px solid var(--cd,var(--verb-deep)); color:var(--cd,var(--verb-deep)); font-weight:800;}
.practiceCard .hint{font-family:var(--font-display); font-weight:800; font-size:21px; color:var(--cd,var(--verb-deep)); background:var(--cs,var(--verb-soft)); display:inline-block; margin-top:10px; padding:7px 16px; border-radius:14px;}
.practiceCard.blankMode .blankWord{font-family:var(--font-word); font-weight:700; font-size:38px; color:var(--ink);}

.answerRow{display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:440px; margin:0 auto; width:100%;}
.answerRow.four{grid-template-columns:1fr 1fr;}
.answerRow.three{grid-template-columns:1fr 1fr 1fr; gap:10px;}
.ansBtn{--c:var(--verb); --cd:var(--verb-deep); --cs:var(--verb-soft);
  font-family:var(--font-word); font-weight:700; font-size:21px; background:var(--cs); color:var(--cd);
  border:3px solid var(--c); border-radius:18px; padding:21px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .1s ease;}
.ansBtn.simple{font-size:23px; padding:22px 6px;}
.answerRow.three .ansBtn.simple{font-size:21px; padding:20px 4px;}
.answerRow.four .ansBtn.simple{font-size:21px; padding:19px 4px;}
.ansBtn .ic{font-size:33px;}
.ansBtn .sub{font-size:14.5px; font-weight:600;}
.ansBtn:active{transform:scale(.96);}
.ansBtn.correct{background:var(--ok); border-color:#279656; color:#fff;}
.ansBtn.wrong{background:#FFE3E3; border-color:#F0577A; color:#C23B5B; opacity:.7;}
.ansBtn[disabled]{cursor:default;}
.fb{text-align:center; min-height:28px; margin-top:15px; font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--ink-soft);}

/* ---------- sticker reward page ---------- */
.rewardPage{text-align:center; padding:6px 4px;}
.rewardPage .stickerBig{font-size:120px; animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(0) rotate(-15deg);} 70%{transform:scale(1.15) rotate(6deg);} 100%{transform:scale(1) rotate(0);}}
.rewardPage h3{font-family:var(--font-display); font-weight:700; font-size:28px; margin:11px 0 5px; color:var(--ink);}
.rewardPage p{color:var(--ink-soft); font-size:18px; margin:4px 0 18px;}
.starsRow{display:flex; justify-content:center; gap:8px; margin:6px 0 16px;}
.starsRow svg{width:36px; height:36px;}

.confetti{position:fixed; width:9px; height:9px; border-radius:3px; pointer-events:none; z-index:60; animation:fall 1.1s ease-out forwards;}
@keyframes fall{0%{transform:translate(0,0) rotate(0deg); opacity:1;} 100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0;}}

@media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }
</style>

<div class="wrap">
  <header class="top">
    <svg class="mascot" viewBox="0 0 100 100">
      <ellipse cx="36" cy="22" rx="9" ry="22" fill="#FFF8EF" stroke="#4A3B32" stroke-width="3"/>
      <ellipse cx="64" cy="22" rx="9" ry="22" fill="#FFF8EF" stroke="#4A3B32" stroke-width="3"/>
      <ellipse cx="36" cy="24" rx="4.5" ry="13" fill="#FFC9D4"/>
      <ellipse cx="64" cy="24" rx="4.5" ry="13" fill="#FFC9D4"/>
      <circle cx="50" cy="60" r="32" fill="#FFF8EF" stroke="#4A3B32" stroke-width="3"/>
      <circle cx="30" cy="66" r="6" fill="#FFC9D4"/>
      <circle cx="70" cy="66" r="6" fill="#FFC9D4"/>
      <circle cx="40" cy="55" r="3.4" fill="#4A3B32"/>
      <circle cx="60" cy="55" r="3.4" fill="#4A3B32"/>
      <path d="M47 65 q3 3 6 0" stroke="#4A3B32" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="title-block">
      <h1>보너스 샛길 그림책</h1>
      <p class="bubble" id="homeBubble">시험에도 나오는 중요한 내용이에요! Verb 변화·Plural·Pronoun을 확실히 익혀봐요.</p>
    </div>
  </header>

  <div class="shelf" id="shelf"></div>

  <button class="bonusCard" id="bonusCard" disabled>
    <span class="star">⭐</span>
    <span>세 권을 다 읽으면 '한 번에 맞히기'가 열려요!</span>
  </button>

  <p class="footnote">그림책을 눌러서 Verb 변화·Plural·Pronoun을 확실하게 익혀보세요 🌈</p>
</div>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script>
(function(){
  "use strict";

  var ICONS = {
    verb:'<svg viewBox="0 0 48 48"><path d="M8 18 h24 l-7 -7 M32 18 l-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 30 h-24 l7 7 M16 30 l7 -7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plural:'<svg viewBox="0 0 48 48"><rect x="7" y="15" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><rect x="19" y="8" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="3"/></svg>',
    pronoun:'<svg viewBox="0 0 48 48"><circle cx="17" cy="15" r="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M6 39 v-4 a11 11 0 0 1 22 0 v4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="34" cy="13" r="5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M26 39 v-3 a8 8 0 0 1 16 0 v3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
    star:'<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17l-6.1 3.5 1.5-6.8L2.2 9l6.9-.7z"/></svg>'
  };

  /* ================= content ================= */
  var LANDS = {
    verb:{
      title:'Verb 변화', sub:'He·She·It일 때', color:'verb', icon:'verb',
      learn:[
        {art:'🐰', say:'이번엔 Verb 변화를 배워보자! He, She, It일 땐 동사가 달라져요.'},
        {defLine:'주어가 He·She·It(그, 그녀, 그것)이면 동사 끝에 -s나 -es를 붙여요! 이 규칙을 Subject-Verb Agreement(주어-동사 일치)라고 불러요.',
          examples:[{e:'⚽',w:'He plays'},{e:'👋',w:'She touches'},{e:'🏃',w:'It tries'}]},
        {sentence:'He <b>plays</b> soccer.', sentNote:'He는 동사에 -s를 붙여서 plays가 됐어요! 이것이 Subject-Verb Agreement예요.', recap:'He·She·It + Verb-s = Subject-Verb Agreement'}
      ],
      practice:{
        prompt:'빈칸에 알맞은 동사를 골라 보세요!',
        items:[
          {type:'sentenceblank', sentence:'He ___ soccer.', hint:'(play)', correct:'plays', answers:[{key:'plays',label:'plays'},{key:'play',label:'play'}]},
          {type:'sentenceblank', sentence:'She ___ soccer.', hint:'(play)', correct:'plays', answers:[{key:'plays',label:'plays'},{key:'play',label:'play'}]},
          {type:'sentenceblank', sentence:'The dog ___ the ball.', hint:'(touch)', correct:'touches', answers:[{key:'touches',label:'touches'},{key:'touch',label:'touch'}]},
          {type:'sentenceblank', sentence:'He ___ hard.', hint:'(try)', correct:'tries', answers:[{key:'tries',label:'tries'},{key:'try',label:'try'}]},
          {type:'sentenceblank', sentence:'I ___ soccer.', hint:'(play)', correct:'play', answers:[{key:'play',label:'play'},{key:'plays',label:'plays'}]},
          {type:'sentenceblank', sentence:'We ___ soccer.', hint:'(play)', correct:'play', answers:[{key:'play',label:'play'},{key:'plays',label:'plays'}]},
          {type:'sentenceblank', sentence:'She ___ a cake.', hint:'(bake)', correct:'bakes', answers:[{key:'bakes',label:'bakes'},{key:'bake',label:'bake'}]},
          {type:'sentenceblank', sentence:'They ___ soccer.', hint:'(play)', correct:'play', answers:[{key:'play',label:'play'},{key:'plays',label:'plays'}]},
          {type:'sentenceblank', sentence:'The cat ___ with the mouse.', hint:'(play)', correct:'plays', answers:[{key:'plays',label:'plays'},{key:'play',label:'play'}]},
          {type:'defquestion', question:'주어가 He·She·It일 때 동사 끝에 -s나 -es를 붙이는 규칙을 무엇이라고 부를까요?', correct:'sva', answers:[{key:'sva',label:'Subject-Verb Agreement'},{key:'other',label:'Plural'}]},
          {type:'defquestion', question:'‘He plays soccer.’에서 play에 -s가 붙은 건 어떤 규칙 때문일까요?', correct:'sva', answers:[{key:'sva',label:'Subject-Verb Agreement'},{key:'other',label:'Singular Noun'}]}
        ]
      }
    },
    plural:{
      title:'Plural 만들기', sub:'복수형 만들기', color:'plural', icon:'plural',
      learn:[
        {art:'🐰', say:'이번엔 Plural(복수형)을 배워보자! 하나보다 많을 때 쓰는 모양이에요.'},
        {defLine:'하나를 나타내는 명사는 Singular Noun(단수 명사), 여러 개를 나타내는 명사는 Plural Noun(복수 명사)이라고 해요! 보통 Plural Noun은 낱말 뒤에 -s를 붙이지만, 낱말 끝에 따라 모양이 달라져요.',
          examples:[{e:'🐱',w:'cats'},{e:'🚌',w:'buses'},{e:'👶',w:'babies'}]},
        {sentence:'I have two <b>cats</b>.', sentNote:'cat(Singular Noun) 뒤에 -s를 붙여서 cats(Plural Noun)가 됐어요!', recap:'Singular Noun → Plural Noun'}
      ],
      practice:{
        prompt:'복수형(Plural)을 골라 보세요!',
        items:[
          {type:'wordbig', word:'cat', correct:'cats', answers:[{key:'cats',label:'cats'},{key:'cates',label:'cates'},{key:'catss',label:'catss'}]},
          {type:'wordbig', word:'bus', correct:'buses', answers:[{key:'buses',label:'buses'},{key:'bus',label:'bus'},{key:'buss',label:'buss'}]},
          {type:'wordbig', word:'box', correct:'boxes', answers:[{key:'boxes',label:'boxes'},{key:'boxs',label:'boxs'},{key:'boxies',label:'boxies'}]},
          {type:'wordbig', word:'baby', correct:'babies', answers:[{key:'babies',label:'babies'},{key:'babys',label:'babys'},{key:'babyes',label:'babyes'}]},
          {type:'wordbig', word:'toy', correct:'toys', answers:[{key:'toys',label:'toys'},{key:'toies',label:'toies'},{key:'toyes',label:'toyes'}]},
          {type:'wordbig', word:'leaf', correct:'leaves', answers:[{key:'leaves',label:'leaves'},{key:'leafs',label:'leafs'},{key:'leafes',label:'leafes'}]},
          {type:'wordbig', word:'man', correct:'men', answers:[{key:'men',label:'men'},{key:'mans',label:'mans'},{key:'manes',label:'manes'}]},
          {type:'wordbig', word:'child', correct:'children', answers:[{key:'children',label:'children'},{key:'childs',label:'childs'},{key:'childes',label:'childes'}]},
          {type:'wordbig', word:'fish', correct:'fish', answers:[{key:'fish',label:'fish'},{key:'fishes',label:'fishes'},{key:'fishs',label:'fishs'}]},
          {type:'defquestion', question:'‘cat’처럼 하나를 나타내는 명사를 무엇이라고 부를까요?', correct:'singular', answers:[{key:'singular',label:'Singular Noun'},{key:'plural',label:'Plural Noun'}]},
          {type:'defquestion', question:'‘cats’처럼 여러 개를 나타내는 명사를 무엇이라고 부를까요?', correct:'plural', answers:[{key:'plural',label:'Plural Noun'},{key:'singular',label:'Singular Noun'}]}
        ]
      }
    },
    pronoun:{
      title:'Pronoun 복습', sub:'대명사 총정리', color:'pronoun', icon:'pronoun',
      learn:[
        {art:'🐰', say:'마지막으로 대명사를 한 번에 복습해보자!'},
        {defLine:'Subject·Object Pronoun과 This·That·These·Those를 다시 한 번 떠올려봐요!',
          examples:[{e:'🙋',w:'She'},{e:'🎯',w:'us'},{e:'👉',w:'This'}]},
        {sentence:'Tom and I eat dinner. → <b>We</b> eat dinner.', sentNote:'Tom and I를 한 번에 가리키는 말은 We예요!', recap:'대명사 = 이름 대신 쓰는 말'}
      ],
      practice:{
        prompt:'빈칸에 알맞은 낱말을 골라 보세요!',
        items:[
          {type:'sentenceblank', sentence:'Tom and I eat dinner. → ___ eat dinner.', hint:'(주어 자리)', correct:'We', answers:[{key:'We',label:'We'},{key:'They',label:'They'},{key:'You',label:'You'},{key:'He',label:'He'}]},
          {type:'sentenceblank', sentence:'The two cats play together. → ___ play together.', hint:'(주어 자리)', correct:'They', answers:[{key:'He',label:'He'},{key:'She',label:'She'},{key:'They',label:'They'},{key:'It',label:'It'}]},
          {type:'sentenceblank', sentence:'Does Bill like the movie? → Does ___ like the movie?', hint:'(주어 자리)', correct:'He', answers:[{key:'He',label:'He'},{key:'She',label:'She'},{key:'It',label:'It'},{key:'They',label:'They'}]},
          {type:'sentenceblank', sentence:'Is Sarah okay? → Is ___ okay?', hint:'(주어 자리)', correct:'She', answers:[{key:'He',label:'He'},{key:'She',label:'She'},{key:'It',label:'It'},{key:'They',label:'They'}]},
          {type:'sentenceblank', sentence:'My mom likes ___.', hint:'(나를)', correct:'me', answers:[{key:'I',label:'I'},{key:'me',label:'me'},{key:'my',label:'my'},{key:'mine',label:'mine'}]},
          {type:'sentenceblank', sentence:'The boy chases ___.', hint:'(우리를)', correct:'us', answers:[{key:'we',label:'we'},{key:'us',label:'us'},{key:'our',label:'our'},{key:'ours',label:'ours'}]},
          {type:'sentenceblank', sentence:'___ book is interesting.', hint:'(가까운 것 하나)', correct:'This', answers:[{key:'This',label:'This'},{key:'That',label:'That'},{key:'These',label:'These'},{key:'Those',label:'Those'}]},
          {type:'sentenceblank', sentence:'___ apples are delicious.', hint:'(가까이 있는 여러 개)', correct:'These', answers:[{key:'This',label:'This'},{key:'That',label:'That'},{key:'These',label:'These'},{key:'Those',label:'Those'}]},
          {type:'sentenceblank', sentence:'___ building is very tall.', hint:'(멀리 있는 것 하나)', correct:'That', answers:[{key:'This',label:'This'},{key:'That',label:'That'},{key:'These',label:'These'},{key:'Those',label:'Those'}]}
        ]
      }
    }
  };
  var LAND_ORDER = ['verb','plural','pronoun'];

  var BONUS_ITEMS = [
    {type:'sentenceblank', sentence:'He ___ soccer.', hint:'(play)', land:'verb', correct:'plays', answers:[{key:'plays',label:'plays'},{key:'play',label:'play'}]},
    {type:'sentenceblank', sentence:'I ___ soccer.', hint:'(play)', land:'verb', correct:'play', answers:[{key:'play',label:'play'},{key:'plays',label:'plays'}]},
    {type:'wordbig', word:'baby', land:'plural', correct:'babies', answers:[{key:'babies',label:'babies'},{key:'babys',label:'babys'},{key:'babyes',label:'babyes'}]},
    {type:'wordbig', word:'child', land:'plural', correct:'children', answers:[{key:'children',label:'children'},{key:'childs',label:'childs'},{key:'childes',label:'childes'}]},
    {type:'sentenceblank', sentence:'The boy chases ___.', hint:'(우리를)', land:'pronoun', correct:'us', answers:[{key:'we',label:'we'},{key:'us',label:'us'},{key:'our',label:'our'},{key:'ours',label:'ours'}]},
    {type:'sentenceblank', sentence:'___ apples are delicious.', hint:'(가까이 있는 여러 개)', land:'pronoun', correct:'These', answers:[{key:'This',label:'This'},{key:'That',label:'That'},{key:'These',label:'These'},{key:'Those',label:'Those'}]}
  ];

  /* ================= progress ================= */
  function defaultProgress(){ return {verb:0, plural:0, pronoun:0, bonus:0}; }
  var progress = loadProgress();
  function loadProgress(){
    try{ if (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.progress) return window.claude.hot.data.progress; }catch(e){}
    try{ var raw = localStorage.getItem('bonusPathProgressV1'); if (raw) return JSON.parse(raw); }catch(e){}
    return defaultProgress();
  }
  function saveProgress(){
    try{ localStorage.setItem('bonusPathProgressV1', JSON.stringify(progress)); }catch(e){}
    try{ if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {progress:progress}; }); }catch(e){}
  }

  var STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17l-6.1 3.5 1.5-6.8L2.2 9l6.9-.7z" fill="__C__"/></svg>';
  function starSvg(filled){ return STAR_SVG.replace('__C__', filled ? '#BD5FCB' : '#EFE3D1'); }

  function confetti(x, y){
    var colors = ['#5B8DEF','#F2994A','#BD5FCB','#38C172'];
    for (var i=0;i<26;i++){
      var el = document.createElement('div');
      el.className = 'confetti';
      var ang = Math.random()*Math.PI*2, dist = 60+Math.random()*110;
      el.style.setProperty('--dx', Math.cos(ang)*dist+'px');
      el.style.setProperty('--dy', (Math.sin(ang)*dist - 40)+'px');
      el.style.setProperty('--rot', (Math.random()*360)+'deg');
      el.style.left = x+'px'; el.style.top = y+'px';
      el.style.background = colors[i%colors.length];
      document.body.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 1200); })(el);
    }
  }

  /* ================= home render ================= */
  var shelf = document.getElementById('shelf');
  var bonusCard = document.getElementById('bonusCard');
  var homeBubble = document.getElementById('homeBubble');
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');

  function renderHome(){
    shelf.innerHTML = '';
    LAND_ORDER.forEach(function(key, i){
      var land = LANDS[key];
      var s = progress[key]||0;
      var btn = document.createElement('button');
      btn.className = 'landCard'+(s>0?' done':'')+(i===2?' wide':'');
      btn.style.setProperty('--c','var(--'+land.color+')');
      btn.style.setProperty('--cd','var(--'+land.color+'-deep)');
      btn.style.setProperty('--cs','var(--'+land.color+'-soft)');
      btn.innerHTML =
        '<div class="cover">'+ICONS[land.icon]+
        '<div class="coverTitle">'+land.title+'<span>'+land.sub+'</span></div></div>'+
        '<div class="footer"><span class="num">'+(s>0?'다 읽었어요':'그림책 열기')+'</span>'+
        '<span class="sticker">'+(s>0?'⭐':'☆')+'</span></div>';
      btn.onclick = function(){ openLand(key); };
      shelf.appendChild(btn);
    });
    var doneCount = LAND_ORDER.filter(function(k){ return (progress[k]||0)>0; }).length;
    var allDone = doneCount === LAND_ORDER.length;
    bonusCard.classList.toggle('unlocked', allDone);
    bonusCard.disabled = !allDone;
    if (allDone){
      bonusCard.innerHTML = '<span class="star">'+(progress.bonus>0?'🏆':'⭐')+'</span><span>'+(progress.bonus>0?'한 번에 맞히기 다시 하기':'한 번에 맞히기! 눌러서 도전해요')+'</span>';
      bonusCard.onclick = openBonus;
      homeBubble.textContent = progress.bonus>0 ? '와, 보너스 샛길까지 완벽하게 익혔구나! 정말 멋져!' : '그림책 세 권을 다 읽었어! 이제 한 번에 맞혀볼까?';
    } else {
      bonusCard.innerHTML = '<span class="star">⭐</span><span>세 권을 다 읽으면 \'한 번에 맞히기\'가 열려요!</span>';
      bonusCard.onclick = null;
      homeBubble.textContent = doneCount===0 ? '시험에도 나오는 중요한 내용이에요! Verb 변화·Plural·Pronoun을 확실히 익혀봐요.' : '잘하고 있어! 남은 그림책도 같이 읽어보자.';
    }
  }

  /* ================= learn flow ================= */
  function openLand(key){
    renderLearn(key, 0);
    overlay.classList.add('open');
  }

  function renderLearn(key, idx){
    var land = LANDS[key];
    var cards = land.learn;
    panel.innerHTML = '';
    panel.style.setProperty('--c','var(--'+land.color+')');
    panel.style.setProperty('--cd','var(--'+land.color+'-deep)');
    panel.style.setProperty('--cs','var(--'+land.color+'-soft)');

    var head = document.createElement('div');
    head.innerHTML =
      '<div class="panel-head"><h2>'+land.title+' 그림책</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>'+
      '<p class="panel-sub">배워요 · '+(idx+1)+' / '+cards.length+'</p>';
    panel.appendChild(head);

    var stage = document.createElement('div');
    stage.id = 'stage';
    var c = cards[idx];
    var html = '<div class="learnCard">';
    if (c.art) html += '<div class="stageArt">'+c.art+'</div><div class="say">'+c.say+'</div>';
    if (c.defLine){
      html += '<div class="say">'+c.defLine+'</div><div class="exGrid">';
      c.examples.forEach(function(ex){ html += '<div class="exCard"><div class="e">'+ex.e+'</div><div class="w">'+ex.w+'</div></div>'; });
      html += '</div>';
    }
    if (c.sentence){
      html += '<div class="sentence">'+c.sentence+'</div><div class="say" style="font-size:19px;">'+c.sentNote+'</div>'+
        '<div class="recap">'+c.recap+'</div>';
    }
    var dots = '<div class="dots">';
    for (var i=0;i<cards.length;i++) dots += '<span class="'+(i===idx?'on':'')+'"></span>';
    dots += '</div>';
    html += dots + '</div>';
    stage.innerHTML = html;
    panel.appendChild(stage);

    var nextBtn = document.createElement('button');
    nextBtn.className = 'bigNextBtn';
    nextBtn.textContent = (idx === cards.length-1) ? '연습하러 가기 →' : '다음 →';
    nextBtn.onclick = function(){
      if (idx === cards.length-1) startPractice(key);
      else renderLearn(key, idx+1);
    };
    panel.appendChild(nextBtn);

    document.getElementById('closeBtn').onclick = closeAll;
  }

  /* ================= card + feedback builders ================= */
  function buildCardHtml(it){
    if (it.type === 'defquestion'){
      return '<div class="practiceCard sentenceMode"><div class="qLabel">다음 설명에 알맞은 것은?</div><div class="sent">'+it.question+'</div></div>';
    }
    if (it.type === 'sentenceblank'){
      var withBlank = it.sentence.replace('___', '<span class="blank">___</span>');
      return '<div class="practiceCard sentenceMode"><div class="sent">'+withBlank+'</div>'+(it.hint?'<div class="hint">'+it.hint+'</div>':'')+'</div>';
    }
    if (it.type === 'wordbig'){
      return '<div class="practiceCard blankMode"><div class="blankWord">'+it.word+'</div></div>';
    }
    return '<div class="practiceCard"><div class="w">'+(it.w||'')+'</div></div>';
  }
  function wrongFeedback(it, correctAns){
    return '정답은 ‘' + correctAns.label + '’예요. 다음엔 맞힐 수 있어요!';
  }

  /* ================= practice flow (generic N-way, item-level answers) ================= */
  function startPractice(key){
    var land = LANDS[key];
    var items = land.practice.items;
    var idx = 0, correct = 0;
    renderQ();

    function renderQ(){
      panel.innerHTML = '';
      var head = document.createElement('div');
      head.innerHTML =
        '<div class="panel-head"><h2>'+land.title+' 연습</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>'+
        '<p class="panel-sub">'+land.practice.prompt+'</p>';
      panel.appendChild(head);

      var stage = document.createElement('div');
      stage.id = 'stage';
      var it = items[idx];
      var answers = it.answers;
      var rowClass = 'answerRow' + (answers.length===4?' four':'') + (answers.length===3?' three':'');
      var btnsHtml = answers.map(function(a){
        return '<button class="ansBtn'+(a.icon?'':' simple')+'" data-key="'+a.key+'" style="--c:var(--'+land.color+'); --cd:var(--'+land.color+'-deep); --cs:var(--'+land.color+'-soft);">'+
          (a.icon?'<span class="ic">'+a.icon+'</span>':'')+
          '<span>'+a.label+'</span>'+
          (a.sub?'<span class="sub">'+a.sub+'</span>':'')+
          '</button>';
      }).join('');
      stage.innerHTML =
        '<div class="qn">문제 '+(idx+1)+' / '+items.length+'</div>'+
        buildCardHtml(it)+
        '<div class="'+rowClass+'" id="ansRow">'+btnsHtml+'</div>'+
        '<div class="fb" id="fb"></div>';
      panel.appendChild(stage);
      document.getElementById('closeBtn').onclick = closeAll;

      Array.prototype.forEach.call(stage.querySelectorAll('.ansBtn'), function(b){
        b.onclick = function(){ choose(b.getAttribute('data-key'), b); };
      });

      function choose(pick, btn){
        var btns = stage.querySelectorAll('.ansBtn');
        Array.prototype.forEach.call(btns, function(b){
          b.disabled = true;
          if (b.getAttribute('data-key') === it.correct) b.classList.add('correct');
          else if (b === btn) b.classList.add('wrong');
        });
        var correctAns = answers.filter(function(a){ return a.key === it.correct; })[0];
        var fb = document.getElementById('fb');
        if (pick === it.correct){
          correct++;
          fb.textContent = '정답이에요! 참 잘했어요 ✨'; fb.style.color = '#1EA294';
          var r = btn.getBoundingClientRect();
          confetti(r.left+r.width/2, r.top+r.height/2);
        } else {
          fb.textContent = wrongFeedback(it, correctAns);
          fb.style.color = '#C23B5B';
        }
        var next = document.createElement('button');
        next.className = 'bigNextBtn';
        next.style.marginTop = '14px';
        next.style.setProperty('--c','var(--'+land.color+')');
        next.style.setProperty('--cd','var(--'+land.color+'-deep)');
        next.textContent = (idx===items.length-1) ? '결과 보기 →' : '다음 →';
        next.onclick = function(){ idx++; if (idx>=items.length) finish(); else renderQ(); };
        panel.appendChild(next);
      }
    }
    function finish(){
      var pct = correct/items.length;
      var stars = pct>=0.9 ? 3 : (pct>=0.6 ? 2 : 1);
      showReward(key, correct, items.length, stars);
    }
  }

  /* ================= sticker reward page ================= */
  function showReward(key, correct, total, stars){
    var land = LANDS[key];
    if ((progress[key]||0) < stars){ progress[key] = stars; saveProgress(); }
    panel.innerHTML = '';
    var head = document.createElement('div');
    head.innerHTML = '<div class="panel-head"><h2>'+land.title+' 완료!</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>';
    panel.appendChild(head);
    var stage = document.createElement('div');
    stage.id = 'stage';
    stage.innerHTML =
      '<div class="rewardPage">'+
      '<div class="stickerBig">⭐</div>'+
      '<h3>'+land.title+' 스티커 획득!</h3>'+
      '<div class="starsRow">'+[1,2,3].map(function(i){return starSvg(i<=stars);}).join('')+'</div>'+
      '<p>'+correct+' / '+total+'개를 맞혔어요. '+rewardMsg(stars)+'</p>'+
      '<button class="bigNextBtn" id="rewardBackBtn" style="--c:var(--'+land.color+'); --cd:var(--'+land.color+'-deep);">그림책으로 돌아가기</button>'+
      '</div>';
    panel.appendChild(stage);
    document.getElementById('closeBtn').onclick = closeAll;
    document.getElementById('rewardBackBtn').onclick = closeAll;
    setTimeout(function(){
      var r = stage.querySelector('.stickerBig').getBoundingClientRect();
      confetti(r.left+r.width/2, r.top+r.height/2);
    }, 150);
  }
  function rewardMsg(stars){
    if (stars>=3) return '완벽해요! 토실이가 정말 자랑스러워해요.';
    if (stars===2) return '아주 잘했어요! 한 번 더 하면 완벽해질 거예요.';
    return '스티커를 모았어요! 다시 읽어보면 더 쉬워질 거예요.';
  }

  /* ================= bonus round (mixed lands, item-level answers) ================= */
  function openBonus(){
    var idx = 0, correct = 0;
    overlay.classList.add('open');
    renderQ();
    function renderQ(){
      panel.innerHTML = '';
      panel.style.setProperty('--c','var(--pronoun)');
      panel.style.setProperty('--cd','var(--pronoun-deep)');
      var head = document.createElement('div');
      head.innerHTML =
        '<div class="panel-head"><h2>한 번에 맞히기</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>'+
        '<p class="panel-sub">Verb 변화·Plural·Pronoun을 모두 섞어서 풀어 봐요!</p>';
      panel.appendChild(head);
      var stage = document.createElement('div');
      stage.id = 'stage';
      var it = BONUS_ITEMS[idx];
      var land = LANDS[it.land];
      var answers = it.answers;
      var rowClass = 'answerRow' + (answers.length===4?' four':'') + (answers.length===3?' three':'');
      var btnsHtml = answers.map(function(a){
        return '<button class="ansBtn'+(a.icon?'':' simple')+'" data-key="'+a.key+'" style="--c:var(--'+land.color+'); --cd:var(--'+land.color+'-deep); --cs:var(--'+land.color+'-soft);">'+
          (a.icon?'<span class="ic">'+a.icon+'</span>':'')+
          '<span>'+a.label+'</span>'+
          (a.sub?'<span class="sub">'+a.sub+'</span>':'')+
          '</button>';
      }).join('');
      stage.innerHTML =
        '<div class="qn">문제 '+(idx+1)+' / '+BONUS_ITEMS.length+' &middot; '+land.title+'</div>'+
        buildCardHtml(it)+
        '<div class="'+rowClass+'" id="ansRow">'+btnsHtml+'</div>'+
        '<div class="fb" id="fb"></div>';
      panel.appendChild(stage);
      document.getElementById('closeBtn').onclick = closeAll;

      Array.prototype.forEach.call(stage.querySelectorAll('.ansBtn'), function(b){
        b.onclick = function(){ choose(b.getAttribute('data-key'), b); };
      });

      function choose(pick, btn){
        Array.prototype.forEach.call(stage.querySelectorAll('.ansBtn'), function(b){
          b.disabled = true;
          if (b.getAttribute('data-key') === it.correct) b.classList.add('correct');
          else if (b === btn) b.classList.add('wrong');
        });
        var correctAns = answers.filter(function(a){ return a.key === it.correct; })[0];
        var fb = document.getElementById('fb');
        if (pick === it.correct){
          correct++;
          fb.textContent = '정답이에요! ✨'; fb.style.color = '#1EA294';
          var r = btn.getBoundingClientRect();
          confetti(r.left+r.width/2, r.top+r.height/2);
        } else {
          fb.textContent = wrongFeedback(it, correctAns);
          fb.style.color = '#C23B5B';
        }
        var next = document.createElement('button');
        next.className = 'bigNextBtn';
        next.style.marginTop = '14px';
        next.textContent = (idx===BONUS_ITEMS.length-1) ? '결과 보기 →' : '다음 →';
        next.onclick = function(){ idx++; if (idx>=BONUS_ITEMS.length) finish(); else renderQ(); };
        panel.appendChild(next);
      }
    }
    function finish(){
      var pct = correct/BONUS_ITEMS.length;
      var stars = pct>=0.9 ? 3 : (pct>=0.6 ? 2 : 1);
      if ((progress.bonus||0) < stars){ progress.bonus = stars; saveProgress(); }
      panel.innerHTML = '';
      var head = document.createElement('div');
      head.innerHTML = '<div class="panel-head"><h2>도전 완료!</h2><button class="iconBtn" id="closeBtn">&#10005;</button></div>';
      panel.appendChild(head);
      var stage = document.createElement('div'); stage.id='stage';
      stage.innerHTML =
        '<div class="rewardPage">'+
        '<div class="stickerBig">🏆</div>'+
        '<h3>최고예요!</h3>'+
        '<div class="starsRow">'+[1,2,3].map(function(i){return starSvg(i<=stars);}).join('')+'</div>'+
        '<p>'+correct+' / '+BONUS_ITEMS.length+'개를 맞혔어요. 정말 열심히 했어요!</p>'+
        '<button class="bigNextBtn" id="rewardBackBtn" style="--c:var(--pronoun); --cd:var(--pronoun-deep);">그림책으로 돌아가기</button>'+
        '</div>';
      panel.appendChild(stage);
      document.getElementById('closeBtn').onclick = closeAll;
      document.getElementById('rewardBackBtn').onclick = closeAll;
      setTimeout(function(){
        var r = stage.querySelector('.stickerBig').getBoundingClientRect();
        confetti(r.left+r.width/2, r.top+r.height/2);
      }, 150);
    }
  }

  function closeAll(){ overlay.classList.remove('open'); renderHome(); }

  renderHome();

  try{
    if (window.claude && window.claude.hot){
      var boot = function(){ renderHome(); };
      if (window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
    }
  }catch(e){}
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎯 Grammar Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg:#FFE000; --bg2:#FFC400;
  --surface:#FFFFFF; --surf2:#FFF9DC;
  --yellow:#FFD600; --yellow2:#F0B800;
  --red:#E53E00; --red2:#BF2E00;
  --ink:#1A1A1A; --ink2:#4A2A00; --ink3:#9E7020;
  --correct:#16A34A; --correct-tint:#DCFCE7;
  --wrong:#DC2626; --wrong-tint:#FEE2E2;
  --radius:20px;
  --shadow:0 4px 0 rgba(0,0,0,.18), 0 6px 20px rgba(0,0,0,.10);
  --cshadow:0 4px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-family:"Baloo 2",sans-serif;font-size:18px}
#app{max-width:680px;margin:0 auto;padding:20px 16px 80px}

/* 카드 */
.card{background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--cshadow)}
.card+.card{margin-top:14px}

/* 버튼 */
.btn{display:block;width:100%;border:2.5px solid var(--ink);border-bottom:5px solid var(--ink);background:var(--red);color:#fff;font-family:"Jua",sans-serif;font-size:24px;padding:16px;border-radius:var(--radius);cursor:pointer;text-align:center;transition:transform .1s}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn-y{background:var(--yellow);color:var(--ink)}
.btn-sm{font-size:18px;padding:11px 22px;width:auto;display:inline-block}
.btn-ghost{background:var(--surface);color:var(--ink);font-size:17px;padding:11px 20px;border-radius:14px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;font-family:"Baloo 2",sans-serif;font-weight:700}

/* 진행 바 */
.prog-wrap{background:rgba(0,0,0,.1);border-radius:999px;height:12px;overflow:hidden;border:2px solid var(--ink);margin-bottom:6px}
.prog-fill{height:100%;background:var(--red);border-radius:999px;transition:width .3s ease}
.prog-label{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);font-weight:700;margin-bottom:8px}

/* 상단 바 */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topbar-title{font-family:"Jua",sans-serif;font-size:20px;color:var(--ink);flex:1}

/* 스플래시 */
.splash{text-align:center;padding:20px 0 10px}
.sc-wrap{display:flex;justify-content:center;margin-bottom:10px}
@keyframes scBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px) rotate(-4deg)}70%{transform:translateY(-18px) rotate(4deg)}}
.sc-bounce{animation:scBounce 1.8s ease-in-out infinite;display:inline-block}
.splash h1{font-family:"Jua",sans-serif;font-size:52px;color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);margin-bottom:6px}
.splash p{font-size:18px;font-weight:700;color:var(--ink2);margin-bottom:20px}

/* 세계지도 */
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tc{background:var(--surface);border:2.5px solid var(--ink);border-radius:18px;padding:16px 12px;text-align:center;cursor:pointer;position:relative;transition:transform .12s;box-shadow:0 4px 0 var(--ink)}
.tc:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.tc.done{border-color:var(--correct);background:var(--correct-tint)}
.tc.active{border-color:var(--red);background:#FFF0EB}
.tc .t-icon{font-size:28px;margin-bottom:4px}
.tc .t-name{font-size:14px;font-weight:800;line-height:1.3}
.tc .t-count{font-size:12px;color:var(--ink3);margin-top:3px}
.tc .t-badge{position:absolute;top:8px;right:10px;font-size:14px}
.tc .t-stars{font-size:13px;margin-top:4px;letter-spacing:1px}

/* 규칙 슬라이드 */
.char-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.char-box{flex:none;background:var(--yellow);border:2.5px solid var(--ink);border-radius:16px;padding:8px;width:82px;height:90px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink)}
.bubble{background:var(--red);color:#fff;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:16px;font-weight:700;line-height:1.6;flex:1;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.chalk{background:#1a3320;border:2.5px solid var(--ink);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 0 var(--ink)}
.chalk-title{font-size:12px;font-weight:700;letter-spacing:2px;color:#4ade80;margin-bottom:10px}
.chalk table{width:100%;border-collapse:collapse;color:#f0fff4}
.chalk th{background:#213d28;color:#86efac;font-size:13px;font-weight:700;padding:8px 10px;text-align:left;border-bottom:1px solid #2d6e3a}
.chalk td{padding:9px 10px;font-size:16px;font-weight:700;border-top:1px solid #2d6e3a}
.chalk td.hl{color:var(--yellow);font-size:18px}
.chalk td.dim{color:#a8d8b0}
.ex-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ex-chip{background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:8px 14px;text-align:center;min-width:90px;box-shadow:0 3px 0 var(--ink)}
.ex-chip b{display:block;font-size:17px;color:var(--ink)}
.ex-chip small{font-size:13px;color:var(--ink2)}
.slide-dots{display:flex;gap:6px;margin-bottom:14px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.15);border:2px solid var(--ink)}
.dot.on{background:var(--red);border-color:var(--red)}

/* 문제 */
.q-label{font-size:12px;font-weight:700;letter-spacing:2.5px;color:var(--ink2);margin-bottom:10px}
.q-badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:12px;border:1.5px solid var(--ink)}
.q-sent{font-size:24px;font-weight:700;color:var(--ink);line-height:1.7;margin-bottom:14px;text-align:center;font-family:"Jua",sans-serif}
.q-blank{background:var(--yellow);color:var(--ink);padding:2px 16px;border-radius:8px;font-weight:900;border:2px solid var(--ink)}
.q-sub{font-size:15px;color:var(--ink2);margin-bottom:16px;padding:10px 14px;background:var(--yellow);border-radius:12px;border:2px solid var(--ink);line-height:1.7;box-shadow:0 3px 0 var(--ink)}
.q-sub .exam-tag{color:var(--red);font-weight:700;font-size:13px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opt{background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:16px 8px;color:var(--ink);font-family:"Baloo 2",sans-serif;font-size:20px;font-weight:900;cursor:pointer;text-align:center;box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--correct-tint);border-color:var(--correct);color:var(--correct);box-shadow:0 4px 0 var(--correct)}
.opt.ng{background:var(--wrong-tint);border-color:var(--wrong);color:var(--wrong);box-shadow:0 4px 0 var(--wrong)}
.fb{font-size:16px;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid;text-align:center;margin-bottom:14px;display:none}
.fb.ok{color:var(--correct);background:var(--correct-tint);border-color:var(--correct);display:block}
.fb.ng{color:var(--wrong);background:var(--wrong-tint);border-color:var(--wrong);display:block}
.type-input{width:100%;background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:16px 18px;color:var(--ink);font-family:"Baloo 2",sans-serif;font-size:24px;font-weight:700;margin-bottom:10px;outline:none;box-shadow:0 4px 0 var(--ink)}
.type-input.ok{border-color:var(--correct);box-shadow:0 4px 0 var(--correct);background:var(--correct-tint)}
.type-input.ng{border-color:var(--wrong);box-shadow:0 4px 0 var(--wrong);background:var(--wrong-tint)}
.type-hint{font-size:13px;color:var(--ink3);margin-bottom:14px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s ease}

/* 결과 */
.result-hero{text-align:center;padding:20px 0 8px}
.result-emoji{font-size:72px;line-height:1;margin-bottom:8px}
.result-title{font-family:"Jua",sans-serif;font-size:44px;color:var(--red);-webkit-text-stroke:1.5px var(--ink);line-height:1.2}
.stars-big{font-size:36px;letter-spacing:6px;margin:10px 0}
.result-sub{font-size:18px;color:var(--ink2);margin-top:6px}
.tr-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px solid #EEE;font-size:15px}
.tr-row:last-child{border-bottom:none}
.tr-bar-bg{flex:1;background:#EEE;border-radius:999px;height:9px;overflow:hidden;border:1.5px solid var(--ink)}
.tr-bar{height:100%;border-radius:999px;background:var(--red)}
.overall-card{background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--radius);padding:20px;box-shadow:var(--cshadow)}

/* 미션 칩 */
.mission-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.m-chip{background:var(--yellow);border:2px solid var(--ink);border-radius:12px;padding:9px 6px;text-align:center;font-size:13px;font-weight:700;line-height:1.4;box-shadow:0 3px 0 var(--ink)}
.m-chip .m-icon{font-size:20px;display:block;margin-bottom:3px}

/* 최종 완료 */
.final-hero{text-align:center;padding:30px 0 16px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card,.map-grid,.result-hero,.final-hero{animation:fadeUp .3s ease}
</style>
</head>

  {type:'mcq',sent:'"We ___ (have) a great time."',q:'Choose the correct past form.',opts:['haved','has','had','having'],ans:'had',exp:'have → had (불규칙)'},
  {type:'mcq',sent:'"She ___ (walk) to school this morning."',q:'Choose the correct past form.',opts:['walks','walked','walking','walk'],ans:'walked',exp:'규칙동사: walk + ed = walked'},
  {type:'fill',sent:'"They ___ (come) home late."',q:'Type the correct past form.',ans:'came',accept:['came'],exp:'come → came (불규칙)'},
  {type:'fill',sent:'"I ___ (run) 5 km yesterday."',q:'Type the correct past form.',ans:'ran',accept:['ran'],exp:'run → ran (불규칙)'},
],
fut:[
  {type:'mcq',sent:'"I ___ visit my grandma tomorrow."',q:'Choose the correct word.',opts:['will','am','was','did'],ans:'will',exp:'미래: will + 동사원형'},
  {type:'mcq',sent:'"She ___ be a doctor someday."',q:'Choose the correct word.',opts:['will','is','was','were'],ans:'will',exp:'미래: will + 동사원형'},
  {type:'mcq',sent:'"They are ___ to play soccer next week."',q:'Choose the correct word.',opts:['going','go','went','gone'],ans:'going',exp:'be going to + 동사원형'},
  {type:'mcq',sent:'"It ___ rain tomorrow."',q:'Choose the correct word.',opts:['will','is','was','were'],ans:'will',exp:'미래 예측: will + 동사원형'},
  {type:'mcq',sent:'"I will not ___ to the party."',q:'Choose the correct verb form.',opts:['came','come','coming','comes'],ans:'come',exp:'will + 동사원형 (원형!)'},
  {type:'mcq',sent:'Which is the negative future of "I will go"?',q:'Choose the correct form.',opts:["I won't go","I didn't go","I wasn't go","I not will go"],ans:"I won't go",exp:"will not = won't"},
  {type:'fill',sent:'"She is going ___ buy a new phone."',q:'Type the missing word.',ans:'to',accept:['to'],exp:'be going to + 동사원형'},
  {type:'fill',sent:'"We ___ watch a movie tonight."',q:'Type "will".',ans:'will',accept:['will'],exp:'긍정 미래 → will'},
],
pfx:[
  {type:'mcq',sent:'"un + happy = unhappy"',q:'What does the prefix "un-" mean?',opts:['again','not','too much','full of'],ans:'not',exp:'"un-" = not (반대 의미)'},
  {type:'mcq',sent:'"re + charge = recharge"',q:'What does the prefix "re-" mean?',opts:['not','again','under','between'],ans:'again',exp:'"re-" = again (다시)'},
  {type:'mcq',sent:'"kind + ness = kindness"',q:'What does the suffix "-ness" create?',opts:['a verb','an adjective','a noun','an adverb'],ans:'a noun',exp:'"-ness" → 명사를 만듦'},
  {type:'mcq',sent:'"A person who bakes is a ___."',q:'Which suffix is used?',opts:['-ful','-ness','-er','-tion'],ans:'-er',exp:'"-er" = one who does → baker'},
  {type:'mcq',sent:'"over + paid = overpaid"',q:'What does "over-" mean?',opts:['not','again','too much','under'],ans:'too much',exp:'"over-" = too much (너무 많이)'},
  {type:'fill',sent:'"cheer + ful = ___"',q:'Type the complete word.',ans:'cheerful',accept:['cheerful'],exp:'-ful = full of → cheerful'},
],
};

/* ── 저장소 ── */
var STORE_KEY = 'gquest_v1';
var progress = {};
(function(){
  try{ var d=JSON.parse(localStorage.getItem(STORE_KEY)); if(d) progress=d; }catch(e){}
})();
function saveProgress(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(progress)); }catch(e){} }

/* ── 상태 ── */
var phase='splash', curTopic=null, ruleSlide=0, qIdx=0;
var curAnswers=[], curAttempt=0; // curAttempt: 현재 문제 시도 횟수

/* ── 도우미 ── */
function totalDone(){ return TOPICS.filter(function(t){ return progress[t.id] && progress[t.id].done; }).length; }
function totalQ(){ return TOPICS.reduce(function(s,t){ return s+t.q; },0); }
function getStars(correct,total){ var r=correct/total; return r>=0.9?3:r>=0.7?2:1; }
function topicOf(id){ return TOPICS.find(function(t){ return t.id===id; }); }
function qs(id){ return QUESTIONS[id]; }
function rules(id){ return RULES[id]; }

/* ── 렌더 ── */
var app=document.getElementById('app');
function render(html){ app.innerHTML=html; window.scrollTo({top:0,behavior:'smooth'}); }

/* ── SPLASH ── */
function showSplash(){
  phase='splash';
  var chips=TOPICS.map(function(t){
    return '<div class="m-chip"><span class="m-icon">'+t.icon+'</span>'+t.name+'</div>';
  }).join('');
  render(
    '<div class="splash">'+
      '<div class="sc-wrap"><div class="sc-bounce">'+SC(104,138)+'</div></div>'+
      '<h1>Grammar Quest</h1>'+
      '<p>🏆 시험 대비 Grammar 완전 정복!</p>'+
    '</div>'+
    '<div class="card">'+
      '<p style="color:var(--ink2);font-size:16px;line-height:2;margin-bottom:18px">'+
        '📖 11가지 Grammar 미션을 완료해봐!<br>'+
        '🔮 Rule → 4-Choice → Typing 3단계<br>'+
        '🏆 모두 클리어하면 시험 80점 이상 GO!'+
      '</p>'+
      '<div class="mission-grid">'+chips+'</div>'+
      '<button class="btn" onclick="showMap()">🚀 Quest 시작!</button>'+
    '</div>'
  );
}

/* ── WORLD MAP ── */
function showMap(){
  phase='map';
  var done=totalDone();
  var doneQ=TOPICS.reduce(function(s,t){ return s+(progress[t.id]?progress[t.id].score:0); },0);
  var pct=Math.round(doneQ/totalQ()*100);
  var cards=TOPICS.map(function(t,i){
    var p=progress[t.id]||{};
    var badge= p.done ? '✅' : '';
    var stars= p.done ? starsHtml(p.stars) : '';
    var cls='tc'+(p.done?' done':'');
    return '<div class="'+cls+'" onclick="startTopic(\''+t.id+'\')">'+
      '<div class="t-badge">'+badge+'</div>'+
      '<div class="t-icon">'+t.icon+'</div>'+
      '<div class="t-name">'+t.name+'</div>'+
      '<div class="t-count">'+t.q+' questions</div>'+
      '<div class="t-stars">'+stars+'</div>'+
    '</div>';
  }).join('');
  render(
    '<h2 style="font-family:\'Jua\',sans-serif;font-size:28px;color:var(--ink);margin-bottom:4px">🗺️ Grammar World Map</h2>'+
    '<p style="font-size:15px;color:var(--ink2);margin-bottom:14px">미션을 골라봐! ('+done+'/'+TOPICS.length+' 완료)</p>'+
    '<div class="card" style="margin-bottom:14px">'+
      '<div class="prog-label"><span>전체 진행도</span><span>'+pct+'%</span></div>'+
      '<div class="prog-wrap"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
    '</div>'+
    '<div class="map-grid">'+cards+'</div>'+
    (done===TOPICS.length?'<button class="btn" onclick="showFinal()">🏆 최종 결과 보기!</button>':'')+
    '<button class="btn-ghost" style="width:100%;margin-top:8px;display:block;text-align:center" onclick="showSplash()">🏠 홈으로</button>'
  );
}

function starsHtml(n){
  var s=''; for(var i=0;i<3;i++) s+=(i<n?'⭐':'☆'); return s;
}

/* ── TOPIC START → RULES ── */
function startTopic(id){
  curTopic=id; ruleSlide=0; phase='rules';
  showRule();
}

function showRule(){
  var t=topicOf(curTopic);
  var rs=rules(curTopic);
  var r=rs[ruleSlide];
  var total=rs.length;
  var dots=rs.map(function(_,i){ return '<div class="dot'+(i===ruleSlide?' on':'')+'"></div>'; }).join('');
  var isLast=(ruleSlide===total-1);
  render(
    '<div class="topbar">'+
      '<button class="btn-ghost btn-sm" onclick="showMap()">← 나가기</button>'+
      '<div class="topbar-title">'+t.icon+' '+t.name+'</div>'+
    '</div>'+
    '<div class="prog-label"><span>Rule Study</span><span>'+(ruleSlide+1)+' / '+total+'</span></div>'+
    '<div class="prog-wrap"><div class="prog-fill" style="width:'+Math.round((ruleSlide+1)/total*100)+'%"></div></div>'+
    '<div class="card">'+
      '<div class="slide-dots">'+dots+'</div>'+
      '<div class="char-row">'+
        '<div class="char-box">'+SC(62,82)+'</div>'+
        '<div class="bubble">'+r.msg+'</div>'+
      '</div>'+
      r.html+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">'+
        '<button class="btn-ghost btn-sm" onclick="skipRules()">Skip ⏩</button>'+
        (isLast?
          '<button class="btn btn-sm" onclick="startQuiz()">연습 시작! →</button>':
          '<button class="btn btn-sm" onclick="nextRule()">다음 →</button>')+
      '</div>'+
    '</div>'
  );
}
function nextRule(){ ruleSlide++; showRule(); }
function skipRules(){ startQuiz(); }

/* ── QUIZ ── */
function startQuiz(){
  phase='quiz'; qIdx=0; curAnswers=[]; curAttempt=0;
  showQuestion();
}

function showQuestion(){
  var t=topicOf(curTopic);
  var qs_=qs(curTopic);
  var q=qs_[qIdx];
  var total=qs_.length;
  var pct=Math.round(qIdx/total*100);
  curAttempt=0;

  var qHtml='';
  if(q.type==='mcq'){
    var btns=q.opts.map(function(o,i){
      return '<button class="opt" onclick="checkMcq(this,\''+escQ(o)+'\')" data-opt="'+escQ(o)+'">'+o+'</button>';
    }).join('');
    qHtml=
      '<div class="q-label">✏️ CHOOSE THE ANSWER</div>'+
      (q.exam?'<span class="q-badge" style="background:#FFF0EB;color:var(--red)">⚠️ 시험에 나왔던 유형!</span><br>':'')+
      '<p class="q-sent">'+q.sent+'</p>'+
      '<p class="q-sub">'+q.q+'</p>'+
      '<div class="opts">'+btns+'</div>'+
      '<div class="fb" id="fb"></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:4px">'+
        '<button class="btn-ghost btn-sm" onclick="showMap()">나가기</button>'+
        '<button class="btn btn-sm" id="nextBtn" style="display:none" onclick="nextQ()">다음 →</button>'+
      '</div>';
  } else {
    qHtml=
      '<div class="q-label">🖊️ TYPE THE ANSWER</div>'+
      (q.exam?'<span class="q-badge" style="background:#FFF0EB;color:var(--red)">⚠️ 시험에 나왔던 유형!</span><br>':'')+
      '<p class="q-sent">'+q.sent+'</p>'+
      '<p class="q-sub">'+q.q+'</p>'+
      '<input class="type-input" id="fillInput" type="text" placeholder="정답을 입력하세요" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')checkFill()">'+
      '<div class="type-hint">대문자·소문자 모두 OK</div>'+
      '<div class="fb" id="fb"></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:4px">'+
        '<button class="btn-ghost btn-sm" onclick="showMap()">나가기</button>'+
        '<button class="btn btn-sm" onclick="checkFill()">확인 ✓</button>'+
        '<button class="btn btn-sm" id="nextBtn" style="display:none" onclick="nextQ()">다음 →</button>'+
      '</div>';
  }

  render(
    '<div class="topbar">'+
      '<button class="btn-ghost btn-sm" onclick="showMap()">← 나가기</button>'+
      '<div class="topbar-title">'+t.icon+' '+t.name+'</div>'+
    '</div>'+
    '<div class="prog-label"><span>Practice '+qIdx+' / '+total+'</span><span>'+pct+'%</span></div>'+
    '<div class="prog-wrap"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="card">'+qHtml+'</div>'
  );
  var inp=document.getElementById('fillInput');
  if(inp) inp.focus();
}

function escQ(s){ return s.replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

function checkMcq(btn, selected){
  var q=qs(curTopic)[qIdx];
  var isCorrect=(selected===q.ans);
  var firstTry=(curAttempt===0);
  curAttempt++;

  var allBtns=document.querySelectorAll('.opt');
  allBtns.forEach(function(b){
    b.disabled=true;
    if(b.getAttribute('data-opt')===q.ans) b.className='opt ok';
    else if(b===btn && !isCorrect) b.className='opt ng';
  });

  var fb=document.getElementById('fb');
  if(fb){
    fb.className='fb '+(isCorrect?'ok':'ng');
    fb.textContent=isCorrect?'✅ '+q.exp:'❌ 정답: '+q.ans+' — '+q.exp;
    fb.style.display='block';
  }

  curAnswers.push({correct:isCorrect, firstTry:firstTry});
  var nb=document.getElementById('nextBtn');
  if(nb) nb.style.display='inline-block';
}

function checkFill(){
  var q=qs(curTopic)[qIdx];
  var inp=document.getElementById('fillInput');
  if(!inp) return;
  var val=inp.value.trim();
  var accepted=q.accept||[q.ans];
  var isCorrect=accepted.some(function(a){ return a.toLowerCase()===val.toLowerCase(); });
  var firstTry=(curAttempt===0);
  curAttempt++;

  var fb=document.getElementById('fb');
  if(isCorrect){
    inp.className='type-input ok';
    if(fb){ fb.className='fb ok'; fb.textContent='✅ '+q.exp; fb.style.display='block'; }
    curAnswers.push({correct:true, firstTry:firstTry});
    var nb=document.getElementById('nextBtn');
    if(nb) nb.style.display='inline-block';
    inp.disabled=true;
    // hide submit button
    var confirmBtn=inp.nextElementSibling && inp.nextElementSibling.nextElementSibling;
  } else {
    inp.className='type-input ng';
    inp.classList.add('shake');
    setTimeout(function(){ inp.classList.remove('shake'); }, 400);
    if(curAttempt>=2){
      // 두 번째 시도도 틀리면 정답 보여주고 넘어가기
      if(fb){ fb.className='fb ng'; fb.textContent='❌ 정답: '+q.ans+' — '+q.exp; fb.style.display='block'; }
      curAnswers.push({correct:false, firstTry:false});
      var nb2=document.getElementById('nextBtn');
      if(nb2) nb2.style.display='inline-block';
      inp.disabled=true;
    } else {
      if(fb){ fb.className='fb ng'; fb.textContent='❌ 다시 한번 해봐! 힌트: '+q.exp.split('→')[0]; fb.style.display='block'; }
    }
  }
}

function nextQ(){
  var total=qs(curTopic).length;
  qIdx++;
  if(qIdx>=total){
    showTopicResult();
  } else {
    showQuestion();
  }
}

/* ── TOPIC RESULT ── */
function showTopicResult(){
  var t=topicOf(curTopic);
  var total=qs(curTopic).length;
  var correct=curAnswers.filter(function(a){ return a.correct; }).length;
  var firstTryOk=curAnswers.filter(function(a){ return a.correct&&a.firstTry; }).length;
  var stars=getStars(firstTryOk, total);

  progress[curTopic]={ done:true, score:correct, total:total, stars:stars };
  saveProgress();

  var done=totalDone();
  var allDone=(done===TOPICS.length);

  // 전체 진행 현황
  var rows=TOPICS.map(function(t2){
    var p=progress[t2.id]||{};
    var pct2=p.done?Math.round(p.score/p.total*100):0;
    return '<div class="tr-row">'+
      '<span style="font-size:18px">'+t2.icon+'</span>'+
      '<span style="min-width:120px;font-weight:700;font-size:14px;color:'+(p.done?'var(--ink)':'var(--ink3)')+'">'+t2.name+'</span>'+
      '<div class="tr-bar-bg"><div class="tr-bar" style="width:'+pct2+'%"></div></div>'+
      '<span style="font-weight:700;font-size:14px;min-width:36px;text-align:right;color:'+(p.done?'var(--red)':'var(--ink3)')+'">'+
        (p.done?p.score+'/'+p.total:'—')+
      '</span>'+
    '</div>';
  }).join('');

  render(
    '<div class="result-hero">'+
      '<div class="result-emoji">'+(stars===3?'🏆':stars===2?'🎉':'🌟')+'</div>'+
      '<div class="result-title">'+t.name+'<br>Clear!</div>'+
      '<div class="stars-big">'+starsHtml(stars)+'</div>'+
      '<div class="result-sub">'+total+'문제 중 <strong style="color:var(--red)">'+correct+'문제</strong> 정답!</div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:14px">'+
      '<div style="font-size:12px;font-weight:700;letter-spacing:2px;color:var(--ink2);margin-bottom:14px">📊 PROGRESS REPORT</div>'+
      rows+
    '</div>'+
    (allDone?
      '<button class="btn" onclick="showFinal()">🏆 전체 완료! 결과 보기!</button>':
      '<button class="btn" onclick="showMap()">🗺️ 다음 미션 선택하기</button>')+
    '<button class="btn-ghost" style="width:100%;margin-top:10px;display:block;text-align:center" onclick="startTopic(curTopic)">🔄 다시 풀기</button>'
  );
}

/* ── FINAL ── */
function showFinal(){
  var totalCorrect=TOPICS.reduce(function(s,t){ return s+(progress[t.id]?progress[t.id].score:0); },0);
  var totalQuestions=totalQ();
  var pct=Math.round(totalCorrect/totalQuestions*100);
  var msg=pct>=90?'완벽해! 시험 무조건 100점! 🎊':pct>=80?'굉장해! 시험 80점 이상 확실해! 🏆':pct>=70?'잘했어! 조금만 더 복습하자! 💪':'다시 도전해보자! 할 수 있어! 🔥';

  var rows=TOPICS.map(function(t){
    var p=progress[t.id]||{};
    var pct2=p.done?Math.round(p.score/p.total*100):0;
    return '<div class="tr-row">'+
      '<span style="font-size:18px">'+t.icon+'</span>'+
      '<span style="min-width:110px;font-weight:700;font-size:14px">'+t.name+'</span>'+
      '<div class="tr-bar-bg"><div class="tr-bar" style="width:'+pct2+'%"></div></div>'+
      '<span style="font-weight:700;font-size:13px;min-width:38px;text-align:right;color:var(--red)">'+
        (p.done?p.score+'/'+p.total:'—')+
      '</span>'+
    '</div>';
  }).join('');

  render(
    '<div class="final-hero">'+
      '<div style="font-size:80px">🏆</div>'+
      '<div style="font-family:\'Jua\',sans-serif;font-size:42px;color:var(--red);-webkit-text-stroke:1.5px var(--ink)">모든 미션 완료!</div>'+
      '<div style="font-size:36px;font-weight:900;color:var(--ink);margin:8px 0">'+totalCorrect+' / '+totalQuestions+'</div>'+
      '<div style="font-size:18px;font-weight:700;color:var(--ink2)">'+msg+'</div>'+
    '</div>'+
    '<div class="overall-card" style="margin-bottom:14px">'+
      '<div style="font-size:12px;font-weight:700;letter-spacing:2px;color:var(--ink2);margin-bottom:14px">📊 FINAL REPORT</div>'+
      rows+
    '</div>'+
    '<button class="btn" onclick="showMap()">🗺️ 지도로 돌아가기</button>'+
    '<button class="btn-ghost" style="width:100%;margin-top:10px;display:block;text-align:center" onclick="resetAll()">🔄 처음부터 다시하기</button>'
  );
}

function resetAll(){
  if(confirm('정말 처음부터 다시할까요?')){
    progress={};
    saveProgress();
    showSplash();
  }
}

/* ── INIT ── */
showSplash();
</script>
</body>
</html>

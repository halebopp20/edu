<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🍫 Choco Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@400;600;700&display=swap">
<style>
  :root {
    --bg:        #3b1a08;
    --bg2:       #5c2d0e;
    --surface:   #2c1206;
    --surface2:  #3b2010;
    --gold:      #fbbf24;
    --gold2:     #d97706;
    --cream:     #fef3c7;
    --cream2:    #fde68a;
    --correct:   #22c55e;
    --wrong:     #dc2626;
    --radius:    20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(160deg, var(--bg), var(--bg2));
    min-height: 100vh;
    color: var(--cream);
    font-family: "Baloo 2", sans-serif;
    font-size: 18px;
  }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 카드 */
  .card {
    background: var(--surface);
    border: 3px solid var(--gold2);
    border-radius: var(--radius);
    padding: 28px 22px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }

  /* 진행 바 */
  .prog-wrap {
    background: var(--surface);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
    border: 2px solid var(--gold2);
  }
  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    border-radius: 999px;
    transition: width 0.35s ease;
  }
  .prog-label {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    color: var(--cream2);
    font-weight: 700;
    margin-bottom: 6px;
  }

  /* 기본 버튼 */
  .primary-btn {
    width: 100%;
    border: none;
    border-bottom: 5px solid var(--gold2);
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: var(--bg);
    font-family: "Jua", sans-serif;
    font-size: 26px;
    padding: 18px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .primary-btn:active { transform: translateY(3px); border-bottom-width: 2px; }

  /* 흔들림 애니메이션 (오답) */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease; }

  /* 폭죽 파티클 */
  @keyframes burst {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
  .confetti {
    position: fixed;
    width: 12px; height: 12px;
    border-radius: 50%;
    pointer-events: none;
    animation: burst 1.2s ease-out forwards;
  }

  /* 터치 친화적 버튼 */
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  /* 버튼 hover 효과 */
  .sort-btn:hover:not(:disabled),
  .drill-btn:hover:not(:disabled) {
    border-color: var(--gold);
    color: var(--gold);
    transform: translateY(-2px);
  }

  /* 좁은 화면에서 Sort 버튼 세로 배치 */
  @media (max-width: 380px) {
    .sort-btns { flex-direction: column !important; }
  }

  /* 인트로 슬라이드 */
  @keyframes introFadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .intro-card {
    animation: introFadeIn 0.4s ease forwards;
  }
  @keyframes chocoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  .choco-float {
    display: inline-block;
    animation: chocoFloat 1.4s ease-in-out infinite;
  }
</style>
</head>
<body>
<div class="app" id="screen"></div>
<script>
  /* 픽셀 아트 초코 캐릭터 HTML (48×88px, 8px 그리드) */
  var CHOCO_CHAR =
    '<div class="choco-float" style="position:relative;width:48px;height:88px;flex-shrink:0;image-rendering:pixelated">' +
      /* 머리카락 */
      '<div style="position:absolute;top:0;left:8px;width:32px;height:8px;background:#3b1a08"></div>' +
      '<div style="position:absolute;top:8px;left:0;width:48px;height:8px;background:#3b1a08"></div>' +
      /* 얼굴 */
      '<div style="position:absolute;top:8px;left:8px;width:32px;height:8px;background:#f4c07a"></div>' +
      '<div style="position:absolute;top:16px;left:0;width:48px;height:24px;background:#f4c07a"></div>' +
      /* 눈 */
      '<div style="position:absolute;top:22px;left:8px;width:8px;height:8px;background:#2c1206"></div>' +
      '<div style="position:absolute;top:22px;left:32px;width:8px;height:8px;background:#2c1206"></div>' +
      /* 눈 하이라이트 */
      '<div style="position:absolute;top:22px;left:10px;width:4px;height:4px;background:white"></div>' +
      '<div style="position:absolute;top:22px;left:34px;width:4px;height:4px;background:white"></div>' +
      /* 볼 홍조 */
      '<div style="position:absolute;top:28px;left:2px;width:10px;height:6px;background:rgba(255,120,120,0.4);border-radius:50%"></div>' +
      '<div style="position:absolute;top:28px;left:36px;width:10px;height:6px;background:rgba(255,120,120,0.4);border-radius:50%"></div>' +
      /* 입 */
      '<div style="position:absolute;top:32px;left:12px;width:24px;height:8px;background:#c8783a;border-radius:0 0 4px 4px"></div>' +
      /* 몸통 */
      '<div style="position:absolute;top:40px;left:4px;width:40px;height:24px;background:#5c2d0e;border:2px solid #fbbf24"></div>' +
      /* 🍫 배지 */
      '<div style="position:absolute;top:44px;left:16px;width:16px;height:14px;background:#fbbf24;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:9px">🍫</div>' +
      /* 다리 */
      '<div style="position:absolute;top:64px;left:4px;width:16px;height:24px;background:#3b1a08"></div>' +
      '<div style="position:absolute;top:64px;left:28px;width:16px;height:24px;background:#3b1a08"></div>' +
    '</div>';

  var INTRO_SLIDES = [
    {
      lesson: 'LESSON 1',
      speech: "Hi! I'm Choco! Let's learn articles! Use a or an before one thing.",
      bubbleHtml: "Hi! I'm <strong>Choco</strong>! 🍫<br>Let's learn <strong>articles</strong>!",
      cards: [
        { article: 'a',  emoji: '🐱', word: 'cat' },
        { article: 'an', emoji: '🍎', word: 'apple' },
      ],
    },
    {
      lesson: 'LESSON 2',
      speech: "Use a before a consonant sound. Use an before a vowel sound!",
      bubbleHtml: "<strong>a</strong> + consonant sound 🔤<br><strong>an</strong> + vowel sound 🅰️",
      cards: [
        { article: 'a',  emoji: '🚲', word: 'bicycle' },
        { article: 'an', emoji: '🥚', word: 'egg' },
      ],
    },
    {
      lesson: 'LESSON 3',
      speech: "Only one in the world? Say the! Can't count it? Say some!",
      bubbleHtml: "딱 하나뿐 → <strong>the</strong> 🌍<br>셀 수 없으면 → <strong>some</strong> 💧",
      cards: [
        { article: 'the',  emoji: '☀️', word: 'sun' },
        { article: 'some', emoji: '🥛', word: 'milk' },
      ],
    },
    {
      lesson: 'LESSON 4',
      speech: "a, an, the, some — you've got this! Ready? Let's go!",
      bubbleHtml: "a / an / the / some<br>— you've got this! 🚀",
      cards: [
        { article: 'a',    emoji: '📚', word: 'book' },
        { article: 'an',   emoji: '🥚', word: 'egg' },
        { article: 'the',  emoji: '🌙', word: 'moon' },
        { article: 'some', emoji: '🍞', word: 'bread' },
      ],
    },
  ];

  var WORDS = [
    { word: 'milk',    emoji: '🥛', type: 'noncount' },
    { word: 'cheese',  emoji: '🧀', type: 'noncount' },
    { word: 'bread',   emoji: '🍞', type: 'noncount' },
    { word: 'oil',     emoji: '🫙', type: 'noncount' },
    { word: 'water',   emoji: '💧', type: 'noncount' },
    { word: 'apple',   emoji: '🍎', type: 'count' },
    { word: 'book',    emoji: '📚', type: 'count' },
    { word: 'cat',     emoji: '🐱', type: 'count' },
    { word: 'bicycle', emoji: '🚲', type: 'count' },
    { word: 'banana',  emoji: '🍌', type: 'count' },
    { word: 'salt',    emoji: '🧂', type: 'noncount' },
    { word: 'egg',     emoji: '🥚', type: 'count' },
  ];

  var SENTENCES = [
    { text: 'I drink ___ milk.',                    ans: 'some', hint: 'milk은 셀 수 없어요 → some!' },
    { text: 'She has ___ umbrella.',                ans: 'an',   hint: 'u로 시작하는 소리 → an!' },
    { text: 'Look at ___ sun.',                     ans: 'the',  hint: '태양은 세상에 하나뿐이에요 → the!' },
    { text: 'Tom has a dog. ___ dog is cute.',      ans: 'the',  hint: '앞에서 말한 바로 그 강아지 → the!' },
    { text: 'We need ___ onion.',                   ans: 'an',   hint: 'o로 시작하는 소리 → an!' },
    { text: 'I need ___ cheese.',                   ans: 'some', hint: 'cheese는 셀 수 없어요 → some!' },
    { text: 'Jack has ___ smartphone.',             ans: 'a',    hint: 's는 자음 소리 → a!' },
    { text: '___ sky is clear.',                    ans: 'the',  hint: '하늘은 세상에 하나뿐이에요 → the!' },
    { text: 'She has a cat. ___ cat is small.',     ans: 'the',  hint: '앞에서 말한 바로 그 고양이 → the!' },
    { text: 'I see ___ elephant.',                  ans: 'an',   hint: 'e로 시작하는 소리 → an!' },
    { text: 'He drinks ___ water every day.',       ans: 'some', hint: 'water는 셀 수 없어요 → some!' },
    { text: 'I have ___ idea!',                     ans: 'an',   hint: 'i로 시작하는 소리 → an!' },
    { text: 'I like ___ moon.',                     ans: 'the',  hint: '달은 세상에 하나뿐이에요 → the!' },
    { text: 'Ann has a bag. ___ bag is red.',       ans: 'the',  hint: '앞에서 말한 바로 그 가방 → the!' },
    { text: 'Can I have ___ bread?',               ans: 'some', hint: 'bread는 셀 수 없어요 → some!' },
    { text: 'She is ___ honest girl.',              ans: 'an',   hint: 'h는 묵음 → an honest!' },
  ];

  var state = {
    sortQueue:  [],
    drillQueue: [],
    turn: 'sort',
    totalSort:  0,
    totalDrill: 0,
    firstCorrectSort:  0,
    firstCorrectDrill: 0,
    startTime: null,
  };

  function initQueues() {
    state.sortQueue = WORDS.map(function(w) {
      return { word: w.word, emoji: w.emoji, type: w.type, firstTry: true };
    });
    state.drillQueue = SENTENCES.map(function(s) {
      return { text: s.text, ans: s.ans, hint: s.hint, firstTry: true };
    });
    state.turn = 'sort';
    state.totalSort  = state.sortQueue.length;
    state.totalDrill = state.drillQueue.length;
    state.firstCorrectSort  = 0;
    state.firstCorrectDrill = 0;
    state.startTime = new Date();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var screenEl = document.getElementById('screen');

  function renderSort() {
    var item = state.sortQueue[0];

    screenEl.innerHTML =
      progressHtml() +
      '<div class="card" style="margin-top:14px">' +
        '<div style="font-size:13px;font-weight:700;letter-spacing:2px;color:var(--cream2);margin-bottom:16px">📦 SORT THE WORD</div>' +
        '<div id="wordCard" style="text-align:center;background:var(--surface2);border:3px solid var(--gold);border-radius:var(--radius);padding:28px 20px;margin-bottom:24px">' +
          '<div style="font-size:60px;line-height:1;margin-bottom:10px">' + esc(item.emoji) + '</div>' +
          '<div style="font-size:28px;font-weight:700;color:var(--cream)">' + esc(item.word) + '</div>' +
        '</div>' +
        '<div class="sort-btns" style="display:flex;gap:14px">' +
          '<button class="sort-btn" data-type="count" style="flex:1;background:var(--surface2);border:3px solid var(--gold);border-radius:var(--radius);padding:20px 10px;cursor:pointer;color:var(--cream);font-family:\'Baloo 2\',sans-serif;font-size:20px;font-weight:700;transition:all 0.15s">' +
            '<div style="font-size:32px">📦</div>' +
            '<div>Count</div>' +
            '<div style="font-size:14px;color:var(--cream2);margin-top:4px">→ a / an</div>' +
          '</button>' +
          '<button class="sort-btn" data-type="noncount" style="flex:1;background:var(--surface2);border:3px solid var(--gold2);border-radius:var(--radius);padding:20px 10px;cursor:pointer;color:var(--cream);font-family:\'Baloo 2\',sans-serif;font-size:20px;font-weight:700;transition:all 0.15s">' +
            '<div style="font-size:32px">💧</div>' +
            '<div>Noncount</div>' +
            '<div style="font-size:14px;color:var(--cream2);margin-top:4px">→ some</div>' +
          '</button>' +
        '</div>' +
        '<div id="sortFb" style="margin-top:18px;font-size:20px;font-weight:700;text-align:center;min-height:28px"></div>' +
      '</div>';

    var answered = false;
    document.querySelectorAll('.sort-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (answered) return;
        answered = true;

        var chosen = btn.getAttribute('data-type');
        var correct = item.type;
        var isCorrect = chosen === correct;
        var fb = document.getElementById('sortFb');

        if (isCorrect) {
          if (item.firstTry) state.firstCorrectSort++;
          state.sortQueue.shift();
          btn.style.borderColor = 'var(--correct)';
          btn.style.background = 'rgba(34,197,94,0.15)';
          fb.style.color = 'var(--correct)';
          fb.textContent = '✓ ' + (correct === 'count' ? 'Count!' : 'Noncount!') + ' 🍫';
          state.turn = 'drill';
          setTimeout(nextTurn, 1400);
        } else {
          document.querySelectorAll('.sort-btn').forEach(function(b) { b.disabled = true; });
          item.firstTry = false;
          state.sortQueue.shift();
          state.sortQueue.push(item);
          btn.style.borderColor = 'var(--wrong)';
          btn.style.background = 'rgba(220,38,38,0.15)';
          btn.classList.add('shake');
          fb.style.color = 'var(--wrong)';
          fb.textContent = '✗ 정답은 ' + (correct === 'count' ? 'Count (a/an)' : 'Noncount (some)') + '!';
          state.turn = 'drill';
          setTimeout(nextTurn, 2000);
        }
      });
    });
  }

  function renderDrill() {
    var item = state.drillQueue[0];
    var opts = ['a', 'an', 'the', 'some'];
    var qHtml = esc(item.text).replace(/___/, '<span style="background:var(--gold);color:var(--bg);padding:2px 14px;border-radius:8px;font-weight:900;font-size:28px">___</span>');

    screenEl.innerHTML =
      progressHtml() +
      '<div class="card" style="margin-top:14px">' +
        '<div style="font-size:13px;font-weight:700;letter-spacing:2px;color:var(--cream2);margin-bottom:16px">✏️ FILL IN THE BLANK</div>' +
        '<p style="font-size:24px;font-weight:600;color:var(--cream);line-height:1.7;margin-bottom:24px;text-align:center">' + qHtml + '</p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center" id="drillOpts">' +
          opts.map(function(o) {
            return '<button class="drill-btn" data-ans="' + esc(o) + '" ' +
              'style="min-width:100px;padding:14px 20px;border-radius:var(--radius);background:var(--surface2);border:3px solid var(--gold2);color:var(--cream2);font-family:\'Baloo 2\',sans-serif;font-size:22px;font-weight:900;cursor:pointer;transition:all 0.15s">' +
              esc(o) + '</button>';
          }).join('') +
        '</div>' +
        '<div id="drillFb" style="margin-top:20px;font-size:18px;font-weight:700;text-align:center;min-height:48px;color:var(--cream2)"></div>' +
      '</div>';

    var answered = false;
    document.querySelectorAll('.drill-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (answered) return;
        answered = true;

        var chosen = btn.getAttribute('data-ans');
        var correct = item.ans;
        var isCorrect = chosen === correct;
        var fb = document.getElementById('drillFb');

        document.querySelectorAll('.drill-btn').forEach(function(b) {
          b.disabled = true;
          if (b.getAttribute('data-ans') === correct) {
            b.style.background = 'rgba(34,197,94,0.2)';
            b.style.borderColor = 'var(--correct)';
            b.style.color = 'var(--correct)';
          }
        });

        if (isCorrect) {
          if (item.firstTry) state.firstCorrectDrill++;
          state.drillQueue.shift();
          btn.style.background = 'rgba(34,197,94,0.3)';
          fb.style.color = 'var(--correct)';
          fb.textContent = '✓ 정답! 💡 ' + esc(item.hint);
          state.turn = 'sort';
          setTimeout(nextTurn, 1600);
        } else {
          item.firstTry = false;
          state.drillQueue.shift();
          state.drillQueue.push(item);
          btn.style.background = 'rgba(220,38,38,0.2)';
          btn.style.borderColor = 'var(--wrong)';
          btn.style.color = 'var(--wrong)';
          btn.classList.add('shake');
          fb.style.color = 'var(--gold)';
          fb.innerHTML = '💡 ' + esc(item.hint);
          state.turn = 'sort';
          setTimeout(nextTurn, 2200);
        }
      });
    });
  }

  function launchConfetti() {
    var colors = ['#fbbf24','#d97706','#fef3c7','#f97316','#fde68a','#ffffff'];
    var count = 60;
    for (var i = 0; i < count; i++) {
      (function() {
        var el = document.createElement('div');
        el.className = 'confetti';
        var angle = Math.random() * 2 * Math.PI;
        var dist  = 80 + Math.random() * 180;
        el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--ty', Math.sin(angle) * dist - 120 + 'px');
        el.style.left = (20 + Math.random() * 60) + 'vw';
        el.style.top  = (30 + Math.random() * 30) + 'vh';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDelay = (Math.random() * 0.5) + 's';
        el.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
        document.body.appendChild(el);
        setTimeout(function() { el.remove(); }, 2000);
      })();
    }
  }

  function showParentCard() {
    var total = state.totalSort + state.totalDrill;
    var firstCorrect = state.firstCorrectSort + state.firstCorrectDrill;
    var rate = Math.round((firstCorrect / total) * 100);
    var now = new Date();
    var timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');

    var sortWrong  = state.totalSort  - state.firstCorrectSort;
    var drillWrong = state.totalDrill - state.firstCorrectDrill;
    var weakNote = '';
    if (sortWrong > drillWrong) weakNote = '📦 Count/Noncount 분류 (' + sortWrong + '번 재도전)';
    else if (drillWrong > sortWrong) weakNote = '✏️ 빈칸 채우기 (' + drillWrong + '번 재도전)';
    else weakNote = '골고루 잘 했어요!';

    var card = document.getElementById('parentCard');
    card.style.display = 'block';
    card.innerHTML =
      '<div style="background:var(--surface2);border:2px solid var(--gold2);border-radius:var(--radius);padding:20px;margin-top:16px;text-align:left">' +
        '<div style="font-size:16px;font-weight:700;color:var(--cream2);letter-spacing:1px;margin-bottom:14px">📋 학습 결과 리포트</div>' +
        '<div style="display:flex;flex-direction:column;gap:10px;font-size:18px;color:var(--cream)">' +
          '<div>📅 완료 시각: <strong style="color:var(--gold)">' + timeStr + '</strong></div>' +
          '<div>📊 총 문제: <strong style="color:var(--gold)">' + total + '문제</strong></div>' +
          '<div>🎯 첫 시도 정답률: <strong style="color:var(--gold)">' + rate + '%</strong></div>' +
          '<div>🔍 약점: <strong style="color:var(--gold)">' + weakNote + '</strong></div>' +
        '</div>' +
      '</div>';

    document.getElementById('parentBtn').style.display = 'none';
  }

  function renderEnding() {
    var total = state.totalSort + state.totalDrill;
    var firstCorrect = state.firstCorrectSort + state.firstCorrectDrill;
    var rate = Math.round((firstCorrect / total) * 100);

    var prev = parseInt(localStorage.getItem('aq-best') || '0', 10);
    if (rate > prev) localStorage.setItem('aq-best', String(rate));

    launchConfetti();
    setTimeout(launchConfetti, 700);

    screenEl.innerHTML =
      '<div style="text-align:center;padding:30px 10px">' +
        '<div style="font-size:80px;line-height:1;margin-bottom:16px">🏆</div>' +
        '<h1 style="font-family:Jua,sans-serif;font-size:40px;color:var(--gold);margin-bottom:8px">Choco Master!</h1>' +
        '<p style="font-size:26px;color:var(--cream);margin-bottom:4px">All Clear! 🍫✨</p>' +
        '<p style="font-size:60px;line-height:1.2;margin:16px 0">⭐⭐⭐</p>' +
      '</div>' +
      '<div class="card" style="text-align:center">' +
        '<p style="font-size:22px;color:var(--cream);margin-bottom:8px">총 <strong style="color:var(--gold)">' + total + '문제</strong> 완료!</p>' +
        '<p style="font-size:20px;color:var(--cream2);margin-bottom:20px">첫 시도 정답률: <strong style="color:var(--gold);font-size:28px">' + rate + '%</strong></p>' +
        '<button id="parentBtn" class="primary-btn" style="margin-bottom:12px">부모님께 보여주기 📣</button>' +
        '<div id="parentCard" style="display:none"></div>' +
        '<button id="retryBtn" class="primary-btn" style="margin-top:8px;background:var(--surface2);border-bottom-color:var(--surface);color:var(--cream2)">다시 도전! 🔄</button>' +
      '</div>';

    document.getElementById('parentBtn').addEventListener('click', showParentCard);
    document.getElementById('retryBtn').addEventListener('click', function() {
      renderHome();
    });
  }

  function remainingCount() {
    return state.sortQueue.length + state.drillQueue.length;
  }

  function totalCount() {
    return state.totalSort + state.totalDrill;
  }

  function progressHtml() {
    var remaining = remainingCount();
    var done = totalCount() - remaining;
    var pct = Math.round((done / totalCount()) * 100);
    return (
      '<div class="prog-label">' +
        '<span>🍫 남은 문제 <strong>' + remaining + '개</strong></span>' +
        '<span>' + pct + '%</span>' +
      '</div>' +
      '<div class="prog-wrap"><div class="prog-fill" style="width:' + pct + '%"></div></div>'
    );
  }

  function nextTurn() {
    if (state.sortQueue.length === 0 && state.drillQueue.length === 0) {
      renderEnding();
      return;
    }
    if (state.turn === 'sort' && state.sortQueue.length > 0) {
      renderSort();
      return;
    }
    if (state.turn === 'drill' && state.drillQueue.length > 0) {
      renderDrill();
      return;
    }
    // 한쪽 큐가 빈 경우 남은 쪽으로 전환
    if (state.sortQueue.length > 0) { state.turn = 'sort'; renderSort(); }
    else { state.turn = 'drill'; renderDrill(); }
  }

  function speakLine(text, onEnd) {
    if (!window.speechSynthesis) { onEnd(); return; }
    if (sessionStorage.getItem('aq-mute') === '1') { onEnd(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang  = 'en-US';
    u.rate  = 1.1;   /* 약간 빠르게 — 어린이 느낌 */
    u.pitch = 1.7;   /* 높은 음조 — 8세 여자아이 느낌 */
    /* 여성 음성 우선 선택 (iOS: Samantha, Chrome: Google US English Female 등) */
    var voices = window.speechSynthesis.getVoices();
    var preferNames = ['samantha', 'karen', 'female', 'girl', 'zira', 'fiona', 'victoria'];
    for (var i = 0; i < voices.length; i++) {
      var vname = voices[i].name.toLowerCase();
      if (voices[i].lang.indexOf('en') !== 0) continue;
      for (var j = 0; j < preferNames.length; j++) {
        if (vname.indexOf(preferNames[j]) !== -1) { u.voice = voices[i]; break; }
      }
      if (u.voice) break;
    }
    u.onend = onEnd;
    u.onerror = onEnd;
    window.speechSynthesis.speak(u);
  }

  function renderIntro() {
    var fallbackTimer = null;

    function showSlide(idx) {
      clearTimeout(fallbackTimer);

      var slide    = INTRO_SLIDES[idx];
      var total    = INTRO_SLIDES.length;
      var pct      = Math.round(((idx + 1) / total) * 100);
      var isMuted  = sessionStorage.getItem('aq-mute') === '1';

      /* 점 인디케이터 HTML */
      var dotsHtml = INTRO_SLIDES.map(function(_, i) {
        var isActive = i === idx;
        return '<div style="width:8px;height:8px;border-radius:50%;background:' +
          (isActive ? 'var(--gold)' : 'var(--surface2)') +
          ';border:2px solid ' +
          (isActive ? 'var(--gold)' : 'var(--gold2)') +
          '"></div>';
      }).join('');

      /* 예문 카드 HTML */
      var cardsHtml = slide.cards.map(function(c) {
        return '<div style="background:var(--surface2);border:2px solid var(--gold2);border-radius:14px;padding:10px 16px;text-align:center;font-size:18px;font-weight:700">' +
          '<span style="color:var(--gold);font-size:22px;font-weight:900;display:block">' + esc(c.article) + '</span>' +
          '<span style="color:var(--cream2)">' + c.emoji + ' ' + esc(c.word) + '</span>' +
        '</div>';
      }).join('');

      screenEl.innerHTML =
        '<div class="intro-card card" style="margin-top:14px">' +
          /* 음소거 버튼 */
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
            '<span style="font-size:12px;font-weight:700;letter-spacing:2px;color:var(--cream2)">📖 ' + esc(slide.lesson) + '</span>' +
            '<button id="muteBtn" style="background:transparent;border:1px solid var(--gold2);color:var(--cream2);border-radius:10px;padding:4px 10px;font-size:16px;cursor:pointer">' +
              (isMuted ? '🔇' : '🔊') +
            '</button>' +
          '</div>' +
          /* 진행 바 */
          '<div style="background:var(--surface2);border-radius:999px;height:8px;overflow:hidden;border:1px solid var(--gold2);margin-bottom:20px">' +
            '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:width 0.4s ease"></div>' +
          '</div>' +
          /* 캐릭터 + 말풍선 */
          '<div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:24px">' +
            CHOCO_CHAR +
            '<div style="background:var(--gold);color:var(--bg);border-radius:18px 18px 18px 4px;padding:14px 16px;font-size:18px;font-weight:700;line-height:1.5;flex:1">' +
              slide.bubbleHtml +
            '</div>' +
          '</div>' +
          /* 예문 카드 */
          '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:24px">' +
            cardsHtml +
          '</div>' +
          /* 하단: 점 + Skip */
          '<div style="display:flex;justify-content:space-between;align-items:center">' +
            '<div style="display:flex;gap:6px">' + dotsHtml + '</div>' +
            '<button id="skipBtn" style="background:transparent;border:1px solid var(--gold2);color:var(--cream2);border-radius:12px;padding:8px 14px;font-size:14px;font-family:\'Baloo 2\',sans-serif;cursor:pointer">Skip ⏩</button>' +
          '</div>' +
        '</div>';

      /* 이벤트 바인딩 */
      var skipped = false;

      function goNext() {
        if (skipped) return;
        skipped = true;
        window.speechSynthesis && window.speechSynthesis.cancel();
        if (idx + 1 < total) {
          showSlide(idx + 1);
        } else {
          renderHome();
        }
      }

      document.getElementById('skipBtn').addEventListener('click', function() {
        skipped = true;
        window.speechSynthesis && window.speechSynthesis.cancel();
        renderHome();
      });

      document.getElementById('muteBtn').addEventListener('click', function() {
        skipped = true; /* 이전 goNext 클로저 무효화 */
        var nowMuted = sessionStorage.getItem('aq-mute') === '1';
        sessionStorage.setItem('aq-mute', nowMuted ? '0' : '1');
        window.speechSynthesis && window.speechSynthesis.cancel();
        showSlide(idx); /* 아이콘 갱신을 위해 재렌더 */
      });

      /* TTS 재생 → 종료 후 자동 다음 슬라이드 (슬라이드당 최소 3.5초 보장) */
      var slideShownAt = Date.now();
      fallbackTimer = setTimeout(function() { goNext(); }, 8000); /* 최대 폴백 */
      speakLine(slide.speech, function() {
        clearTimeout(fallbackTimer);
        var elapsed = Date.now() - slideShownAt;
        setTimeout(goNext, Math.max(1000, 3500 - elapsed));
      });
    }

    showSlide(0);
  }

  function renderHome() {
    var best = localStorage.getItem('aq-best') || null;
    var bestHtml = best
      ? '<p style="color:var(--cream2);font-size:18px;margin-top:12px">🏆 최고 기록: <strong>' + best + '%</strong> 첫 시도 정답률</p>'
      : '';

    screenEl.innerHTML =
      '<div style="text-align:center;padding:20px 0 10px">' +
        '<div style="font-size:72px;line-height:1">🍫</div>' +
        '<h1 style="font-family:Jua,sans-serif;font-size:42px;color:var(--gold);margin:8px 0 4px">Choco Quest</h1>' +
        '<p style="color:var(--cream2);font-size:20px;font-weight:700">Master a, an, the &amp; some!</p>' +
      '</div>' +
      '<div class="card">' +
        '<p style="color:var(--cream);font-size:20px;line-height:1.7;margin-bottom:20px">' +
          '🍫 Sort — 단어를 Count / Noncount로 분류해봐!<br>' +
          '✏️ Drill — 빈칸에 알맞은 관사를 골라봐!<br>' +
          '🏆 모두 맞혀야 Choco Master 완성! 틀리면 다시 나와!' +
        '</p>' +
        bestHtml +
        '<button class="primary-btn" id="startBtn" style="margin-top:20px">Start Quest 🚀</button>' +
      '</div>';

    document.getElementById('startBtn').addEventListener('click', function() {
      initQueues();
      nextTurn();
    });
  }

  function renderSplash() {
    screenEl.innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:20px">' +
        '<div style="transform:scale(1.6);margin-bottom:36px">' + CHOCO_CHAR + '</div>' +
        '<h1 style="font-family:Jua,sans-serif;font-size:42px;color:var(--gold);margin-bottom:8px">Choco Quest</h1>' +
        '<p style="color:var(--cream2);font-size:20px;font-weight:700;margin-bottom:40px">Master a, an, the &amp; some!</p>' +
        '<button id="splashBtn" class="primary-btn" style="max-width:320px">🍫 Tap to Start</button>' +
      '</div>';

    document.getElementById('splashBtn').addEventListener('click', function() {
      renderIntro();
    });
  }

  renderSplash();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🍫 Choco Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@400;600;700&display=swap">
<style>
  :root {
    --bg:        #3b1a08;
    --bg2:       #5c2d0e;
    --surface:   #2c1206;
    --surface2:  #3b2010;
    --gold:      #fbbf24;
    --gold2:     #d97706;
    --cream:     #fef3c7;
    --cream2:    #fde68a;
    --correct:   #22c55e;
    --wrong:     #dc2626;
    --radius:    20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(160deg, var(--bg), var(--bg2));
    min-height: 100vh;
    color: var(--cream);
    font-family: "Baloo 2", sans-serif;
    font-size: 18px;
  }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 카드 */
  .card {
    background: var(--surface);
    border: 3px solid var(--gold2);
    border-radius: var(--radius);
    padding: 28px 22px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }

  /* 진행 바 */
  .prog-wrap {
    background: var(--surface);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
    border: 2px solid var(--gold2);
  }
  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    border-radius: 999px;
    transition: width 0.35s ease;
  }
  .prog-label {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    color: var(--cream2);
    font-weight: 700;
    margin-bottom: 6px;
  }

  /* 기본 버튼 */
  .primary-btn {
    width: 100%;
    border: none;
    border-bottom: 5px solid var(--gold2);
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: var(--bg);
    font-family: "Jua", sans-serif;
    font-size: 26px;
    padding: 18px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .primary-btn:active { transform: translateY(3px); border-bottom-width: 2px; }

  /* 흔들림 애니메이션 (오답) */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease; }

  /* 폭죽 파티클 */
  @keyframes burst {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
  .confetti {
    position: fixed;
    width: 12px; height: 12px;
    border-radius: 50%;
    pointer-events: none;
    animation: burst 1.2s ease-out forwards;
  }
</style>
</head>
<body>
<div class="app" id="screen"></div>
<script>
  // Task 2 이후에 채울 예정
</script>
</body>
</html>
